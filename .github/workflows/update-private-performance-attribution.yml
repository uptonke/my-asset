name: Update Private Performance Attribution
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: private-performance-attribution
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_TABLE: portfolio_db
      PORTFOLIO_ROW_ID: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_performance_attribution.py
      - run: python -m unittest discover -s tests -p test_historical_brinson.py
      - run: python -m unittest discover -s tests -p test_coverage_v23.py
      - run: python -m unittest discover -s tests -p test_market_recovery_v231.py
      - run: python -m unittest discover -s tests -p test_automated_nav_v24.py
      - run: python -m unittest discover -s tests -p test_attribution_v27.py
      - run: python -m unittest discover -s tests -p test_research_v32.py
      - name: Publish private report only
        env:
          # Manual workflow dispatch always rebuilds. Reusable callers
          # are scheduled checks, including manually run parent pipelines.
          ATTRIBUTION_IF_STALE: ${{ github.workflow == 'Update Private Performance Attribution' && 'false' || 'true' }}
        run: python scripts/build_performance_attribution.py

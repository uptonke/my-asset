name: One-time signal relevance audit upgrade

on:
  push:
    paths:
      - '.github/workflows/signal-relevance-audit-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply portfolio relevance and compact audit patch
        run: python scripts/patch_signal_relevance_audit_once.py

      - name: Validate ranking behavior and UI
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py scripts/patch_signal_relevance_audit_once.py
          python scripts/build_frontend_bundle.py --check
          node --check assets/js/src/app.bundle.source.js
          node --check assets/js/app.bundle.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import ast
          import math

          main = Path('main.py').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          assert 'deterministic_domain_dedup_signal_strength_plus_portfolio_relevance_v2' in main
          assert 'portfolio_relevance_bonus' in main and 'selection_score' in main
          assert 'load_portfolio_relevance_context' in main
          assert '風險資產環境偏正向' in main
          assert '持倉關聯' in index and '選擇分數' in index
          assert 'signals · 點選查看細節' in index
          assert '<details v-for="signal in (aiInsights?.auditSignals || [])"' in index

          tree = ast.parse(main)
          wanted = {'_is_missing', '_num', '_clamp01', '_signal_status', 'build_signal_audit'}
          nodes = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = {t.id for t in node.targets if isinstance(t, ast.Name)}
                  if names & {'MACRO_SIGNAL_SPECS', 'MACRO_DOMAIN_ORDER'}:
                      nodes.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name in wanted:
                  nodes.append(node)
          ns = {'math': math}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), '<audit-v2-test>', 'exec'), ns)

          raw = {
              'move_index': 102.19, 'move_z': 2.10,
              'sys_corr': 0.24,
              'rsp_spy_mom': 3.63,
              'soxx_spy_mom': -12.27,
              'hyg_tlt_mom': -4.31,
              'liquidity_spread': -0.46,
          }
          scores = {
              'move_index': -1, 'sys_corr': 2,
              'rsp_spy_mom': 2, 'soxx_spy_mom': -2,
              'hyg_tlt_mom': -2, 'liquidity_spread': 2,
          }
          context = {
              'signal_relevance': {
                  'move_index': {'score': 0.70, 'reason': 'rates'},
                  'sys_corr': {'score': 1.00, 'reason': 'portfolio metric'},
                  'rsp_spy_mom': {'score': 0.45, 'reason': 'broad equity'},
                  'soxx_spy_mom': {'score': 0.90, 'reason': 'tech exposure'},
                  'hyg_tlt_mom': {'score': 0.60, 'reason': 'risk assets'},
                  'liquidity_spread': {'score': 0.50, 'reason': 'usd exposure'},
              }
          }
          rows, top, secondary = ns['build_signal_audit'](raw, scores, context)
          by_key = {r['key']: r for r in rows}
          assert len(top) == 4
          assert by_key['move_index']['priority'] == 3.1
          assert by_key['move_index']['selection_score'] > by_key['move_index']['priority']
          # Same base signal strength inside breadth: higher portfolio relevance must win.
          assert by_key['soxx_spy_mom']['priority'] == by_key['rsp_spy_mom']['priority'] == 2.0
          assert by_key['soxx_spy_mom']['selection_score'] > by_key['rsp_spy_mom']['selection_score']
          assert 'soxx_spy_mom' in top and 'rsp_spy_mom' not in top
          assert '同類別由' in by_key['rsp_spy_mom']['selection_reason']
          assert by_key['sys_corr']['status'] == '低相關・分散環境有利'
          print('signal relevance audit v2 behavior passed:', top, secondary)
          PY

      - name: Commit final change and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/signal-relevance-audit-once.yml scripts/patch_signal_relevance_audit_once.py
          git add main.py index.html
          git diff --cached --check
          git commit -m 'Rank AI macro signals by portfolio relevance and compact audit UI'
          git push origin HEAD:main

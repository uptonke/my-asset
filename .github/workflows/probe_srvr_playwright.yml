name: Probe SRVR Pacer holdings

on:
  push:
    branches:
      - test/remaining-holdings-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Discover SRVR official holdings endpoint
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          TARGET = "https://www.paceretfs.com/products/srvr"
          candidates = []
          bodies = []

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/150.0.0.0 Safari/537.36"
                      ),
                      locale="en-US",
                      viewport={"width": 1440, "height": 1400},
                  )
                  page = await context.new_page()

                  async def capture(response):
                      url = response.url
                      low = url.lower()
                      req_type = response.request.resource_type
                      ct = (response.headers.get("content-type") or "").lower()
                      interesting = any(k in low for k in ["hold", "portfolio", "fund", "srvr", "pacer"])
                      if interesting and req_type in {"xhr", "fetch", "document", "script"}:
                          rec = {
                              "url": url,
                              "status": response.status,
                              "resource_type": req_type,
                              "content_type": ct,
                          }
                          candidates.append(rec)
                          if req_type in {"xhr", "fetch"} or "json" in ct or "csv" in ct:
                              try:
                                  text = await response.text()
                              except Exception as exc:
                                  text = f"<read error {type(exc).__name__}>"
                              if len(text) <= 300000:
                                  bodies.append({**rec, "body_prefix": text[:30000]})

                  page.on("response", capture)
                  resp = await page.goto(TARGET, wait_until="domcontentloaded", timeout=90000)
                  print("document status", resp.status if resp else None)
                  await page.wait_for_timeout(12000)

                  # Scroll through page to trigger lazy sections.
                  for frac in [0.25, 0.5, 0.75, 1.0]:
                      await page.evaluate(f"window.scrollTo(0, document.body.scrollHeight*{frac})")
                      await page.wait_for_timeout(2500)

                  # Try holdings-specific controls.
                  for label in ["Daily Holdings", "View All Holdings", "Holdings"]:
                      try:
                          loc = page.get_by_text(label, exact=False).first
                          if await loc.count():
                              await loc.scroll_into_view_if_needed()
                              try:
                                  await loc.click(timeout=3000)
                              except Exception:
                                  pass
                              await page.wait_for_timeout(3000)
                      except Exception:
                          pass

                  html = await page.content()
                  text = await page.locator("body").inner_text()
                  Path("srvr_page.html").write_text(html, encoding="utf-8")
                  Path("srvr_body.txt").write_text(text, encoding="utf-8")
                  await page.screenshot(path="srvr_page.png", full_page=True)

                  # Pull table-ish rows from rendered DOM.
                  rows = await page.locator("tr").all_inner_texts()
                  holdings_like = [r for r in rows if re.search(r"\b(EQIX|DLR|AMT|CCI|SBAC|IRM)\b", r, re.I)]

                  result = {
                      "document_status": resp.status if resp else None,
                      "document_url": page.url,
                      "body_contains_daily_holdings": "Daily Holdings" in text,
                      "body_contains_EQIX": "EQIX" in text,
                      "candidate_responses": candidates,
                      "captured_bodies": bodies,
                      "rendered_holdings_rows": holdings_like[:30],
                  }
                  Path("srvr_probe.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
                  print(json.dumps(result, ensure_ascii=False, indent=2)[:40000])
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: srvr-playwright-probe
          path: |
            srvr_probe.json
            srvr_body.txt
            srvr_page.html
            srvr_page.png
          if-no-files-found: error

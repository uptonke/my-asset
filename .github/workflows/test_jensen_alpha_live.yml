name: Test Jensen Alpha Live

on:
  push:
    branches:
      - work/jensen-alpha-20260808

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31,<3' 'numpy>=2,<3' 'pandas>=2.2,<3' 'statsmodels>=0.14,<0.15' 'supabase>=2.7,<3'

      - name: Run realized Jensen alpha updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: portfolio_db
          PORTFOLIO_ROW_ID: '1'
        run: python scripts/update_jensen_alpha.py

      - name: Validate saved alpha regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client

          client = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          row = client.table('portfolio_db').select('chaos_meta').eq('id', 1).single().execute().data
          alpha = ((row or {}).get('chaos_meta') or {}).get('alpha_regression') or {}
          if alpha.get('status') not in {'available', 'partial'}:
              raise SystemExit(f"alpha regression not usable: {alpha.get('status')}")
          for benchmark in ('SPY', '^TWII'):
              result = (alpha.get('benchmarks') or {}).get(benchmark) or {}
              if result.get('status') != 'available':
                  raise SystemExit(f"{benchmark} unavailable: {result}")
              required = ['alpha_annualized_pct','alpha_t_stat_hac','alpha_p_value_hac','alpha_ci95_low_annualized_pct','alpha_ci95_high_annualized_pct','beta','r_squared','n']
              missing = [k for k in required if result.get(k) is None]
              if missing:
                  raise SystemExit(f"{benchmark} missing fields: {missing}")
              print(
                  benchmark,
                  'alpha=', result['alpha_annualized_pct'],
                  't=', result['alpha_t_stat_hac'],
                  'p=', result['alpha_p_value_hac'],
                  'CI=', [result['alpha_ci95_low_annualized_pct'], result['alpha_ci95_high_annualized_pct']],
                  'beta=', result['beta'],
                  'R2=', result['r_squared'],
                  'n=', result['n'],
              )
          PY

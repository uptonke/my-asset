name: Patch QQQ Headers

on:
  push:
    branches:
      - feature/holdings-ingestion-20260807
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/holdings-ingestion-20260807
      - name: Patch source and remove this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fetch_portfolio_holdings.py')
          text = p.read_text(encoding='utf-8')
          old = '    r = session.get(url, timeout=HTTP_TIMEOUT, headers={"Referer": "https://www.invesco.com/qqq-etf/en/about.html"})\n'
          new = '''    r = session.get(\n        url,\n        timeout=HTTP_TIMEOUT,\n        headers={\n            "User-Agent": "Mozilla/5.0 my-asset-holdings/1.0",\n            "Accept": "application/json,text/plain,*/*",\n            "Referer": "https://www.invesco.com/qqq-etf/en/about.html",\n        },\n    )\n'''
          if old not in text:
              raise SystemExit('QQQ request line not found; refusing unsafe patch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch_qqq_headers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fetch_portfolio_holdings.py .github/workflows/patch_qqq_headers.yml
          git commit -m 'fix: use accepted Invesco headers for QQQ holdings'
          git push origin HEAD:feature/holdings-ingestion-20260807

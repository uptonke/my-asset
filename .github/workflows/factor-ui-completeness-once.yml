name: One-time factor UI completeness patch

on:
  push:
    paths:
      - '.github/workflows/factor-ui-completeness-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CMA and adjusted R-squared UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          src_path = Path('assets/js/src/app.bundle.source.js')
          idx_path = Path('index.html')
          src = src_path.read_text(encoding='utf-8')
          idx = idx_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # Initial stats state: keep adjusted R² explicit rather than relying on an undefined property.
          src = replace_once(
              src,
              "            ff_rmw: '-', ff_cma: '-', ff_wml: '-', ff_r_squared: '-', \n            ff_tw_mkt: '-', ff_crypto: '-'",
              "            ff_rmw: '-', ff_cma: '-', ff_wml: '-', ff_r_squared: '-', ff_adj_r_squared: '-', \n            ff_tw_mkt: '-', ff_crypto: '-'",
              'initial factor stats',
          )

          # Cloud factor payload mapping.
          src = replace_once(
              src,
              "                            stats.value.ff_r_squared = macroData.fama_french.r_squared;\n                            stats.value.ff_tw_mkt = macroData.fama_french.tw_mkt;",
              "                            stats.value.ff_r_squared = macroData.fama_french.r_squared;\n                            stats.value.ff_adj_r_squared = macroData.fama_french.adj_r_squared;\n                            stats.value.ff_tw_mkt = macroData.fama_french.tw_mkt;",
              'factor payload adjusted R2 mapping',
          )

          # Preserve the cloud value when the historical-performance stats object is recomputed.
          src = replace_once(
              src,
              "                 ff_r_squared: stats.value.ff_r_squared ?? '-',\n                 ff_status: stats.value.ff_status || 'unavailable',",
              "                 ff_r_squared: stats.value.ff_r_squared ?? '-',\n                 ff_adj_r_squared: stats.value.ff_adj_r_squared ?? '-',\n                 ff_status: stats.value.ff_status || 'unavailable',",
              'recomputed stats adjusted R2 preservation',
          )

          old_subtitle = """                            <span v-if=\"stats?.ff_status === 'available'\">目前持倉以 TWD 市值加權重建報酬 proxy；週頻 OLS。R² = {{ stats?.ff_r_squared ?? '-' }}，n = {{ stats?.ff_sample_count || 0 }}。</span>"""
          new_subtitle = """                            <span v-if=\"stats?.ff_status === 'available'\">目前持倉以 TWD 市值加權重建報酬 proxy；週頻 OLS。R² = {{ stats?.ff_r_squared ?? '-' }}，Adj R² = {{ stats?.ff_adj_r_squared ?? '-' }}，n = {{ stats?.ff_sample_count || 0 }}。</span>"""
          idx = replace_once(idx, old_subtitle, new_subtitle, 'factor subtitle')

          wml_card = """                            <div class=\"bg-gray-900/60 p-3 rounded-xl border border-gray-700/50\">\n                                <div class=\"text-[10px] text-gray-500 mb-1\" title=\">0 偏動能強勢股, <0 偏反轉弱勢股\">動能因子 (WML)</div>\n                                <div class=\"text-lg font-bold font-mono text-purple-400\">{{ stats?.ff_wml ?? '-' }}</div>\n                            </div>"""
          cma_card = """                            <div class=\"bg-gray-900/60 p-3 rounded-xl border border-gray-700/50\">\n                                <div class=\"text-[10px] text-gray-500 mb-1\" title=\">0 偏保守投資企業, <0 偏積極投資企業\">投資風格 (CMA)</div>\n                                <div class=\"text-lg font-bold font-mono text-sky-400\">{{ stats?.ff_cma ?? '-' }}</div>\n                            </div>\n""" + wml_card
          idx = replace_once(idx, wml_card, cma_card, 'CMA card insertion')

          # Bust browser cache for the rebuilt runtime bundle.
          bundle_pattern = r'assets/js/app\.bundle\.js(?:\?v=[^\"\']+)?'
          idx, count = re.subn(bundle_pattern, 'assets/js/app.bundle.js?v=factor-ui-v2', idx, count=1)
          if count != 1:
              raise SystemExit(f'bundle script cache-bust anchor count={count}')

          src_path.write_text(src, encoding='utf-8')
          idx_path.write_text(idx, encoding='utf-8')
          PY

      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          src = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          idx = Path('index.html').read_text(encoding='utf-8')
          for needle in [
              "ff_adj_r_squared: '-'",
              'stats.value.ff_adj_r_squared = macroData.fama_french.adj_r_squared;',
              "ff_adj_r_squared: stats.value.ff_adj_r_squared ?? '-'",
          ]:
              assert needle in src, needle
          for needle in [
              'Adj R² = {{ stats?.ff_adj_r_squared',
              '投資風格 (CMA)',
              "{{ stats?.ff_cma ?? '-' }}",
              'assets/js/app.bundle.js?v=factor-ui-v2',
          ]:
              assert needle in idx, needle
          assert idx.count('投資風格 (CMA)') == 1
          print('Factor UI completeness assertions passed')
          PY

      - name: Commit final change and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/factor-ui-completeness-once.yml
          git add index.html assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Show CMA and adjusted R-squared in factor panel'
          git push origin HEAD:main

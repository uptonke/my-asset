name: One-time portfolio export implementation

on:
  push:
    paths:
      - '.github/workflows/portfolio-export-repair-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply portfolio export patch
        run: python scripts/patch_portfolio_export_once.py

      - name: Build and validate frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -q 'function exportPortfolioPdf' assets/js/src/app.bundle.source.js
          grep -q 'function exportHoldingsCsv' assets/js/src/app.bundle.source.js
          grep -q 'portfolio-export-menu' index.html
          grep -q 'Portfolio export menu v1' assets/css/10-components.css
          git diff --check

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portfolio-export-repair-once.yml scripts/patch_portfolio_export_once.py
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md || true
          git add index.html assets/css/10-components.css assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Add portfolio PDF CSV and JSON export menu'
          git push origin HEAD:main

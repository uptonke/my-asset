name: One-time stock meta non-finite repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stock-meta-nonfinite-once.yml'

permissions:
  contents: write

jobs:
  repair-stock-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch non-finite handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_stock_meta.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''def compute_beta_and_corr(asset: pd.DataFrame, bench: pd.DataFrame) -> Tuple[Optional[float], Optional[float]]:
              if asset.empty or bench.empty:
                  return None, None
              a = asset[["date", "close"]].copy()
              b = bench[["date", "close"]].copy()
              a["date"] = pd.to_datetime(a["date"]).dt.date
              b["date"] = pd.to_datetime(b["date"]).dt.date
              merged = pd.merge(a, b, on="date", suffixes=("_asset", "_bench")).sort_values("date")
              if len(merged) < 80:
                  return None, None
              aligned = pd.concat([merged["close_asset"].pct_change(), merged["close_bench"].pct_change()], axis=1).dropna()
              aligned.columns = ["asset", "bench"]
              if len(aligned) < 60:
                  return None, None
              var = float(np.var(aligned["bench"], ddof=1))
              if var == 0 or not math.isfinite(var):
                  return None, None
              beta = float(np.cov(aligned["asset"], aligned["bench"], ddof=1)[0, 1] / var)
              corr = float(aligned["asset"].corr(aligned["bench"]))
              return beta, corr
          ''',
          '''def compute_beta_and_corr(asset: pd.DataFrame, bench: pd.DataFrame) -> Tuple[Optional[float], Optional[float]]:
              if asset.empty or bench.empty:
                  return None, None
              a = asset[["date", "close"]].copy()
              b = bench[["date", "close"]].copy()
              a["date"] = pd.to_datetime(a["date"]).dt.date
              b["date"] = pd.to_datetime(b["date"]).dt.date
              a["close"] = pd.to_numeric(a["close"], errors="coerce").replace([np.inf, -np.inf], np.nan)
              b["close"] = pd.to_numeric(b["close"], errors="coerce").replace([np.inf, -np.inf], np.nan)
              a = a.dropna(subset=["close"])
              b = b.dropna(subset=["close"])
              a = a[a["close"] > 0]
              b = b[b["close"] > 0]
              merged = pd.merge(a, b, on="date", suffixes=("_asset", "_bench")).sort_values("date")
              if len(merged) < 80:
                  return None, None
              aligned = pd.concat([
                  merged["close_asset"].pct_change(fill_method=None),
                  merged["close_bench"].pct_change(fill_method=None),
              ], axis=1).replace([np.inf, -np.inf], np.nan).dropna()
              aligned.columns = ["asset", "bench"]
              if len(aligned) < 60:
                  return None, None
              var = float(np.var(aligned["bench"], ddof=1))
              if var == 0 or not math.isfinite(var):
                  return None, None
              beta = float(np.cov(aligned["asset"], aligned["bench"], ddof=1)[0, 1] / var)
              corr = float(aligned["asset"].corr(aligned["bench"]))
              if not math.isfinite(beta):
                  beta = None
              if not math.isfinite(corr):
                  corr = None
              return beta, corr
          ''',
          'compute_beta_and_corr')

          replace_once(
          '''def compute_meta(ticker: str, category: str, df: pd.DataFrame, source: str, extras: Dict[str, Any]) -> Dict[str, Any]:
              df = df.dropna(subset=["close"]).sort_values("date").copy()
              close = pd.to_numeric(df["close"], errors="coerce").dropna()
              returns = close.pct_change().dropna()
          ''',
          '''def compute_meta(ticker: str, category: str, df: pd.DataFrame, source: str, extras: Dict[str, Any]) -> Dict[str, Any]:
              df = df.dropna(subset=["close"]).sort_values("date").copy()
              close = pd.to_numeric(df["close"], errors="coerce").replace([np.inf, -np.inf], np.nan).dropna()
              close = close[close > 0]
              returns = close.pct_change(fill_method=None).replace([np.inf, -np.inf], np.nan).dropna()
          ''',
          'compute_meta returns cleanup')

          replace_once(
          '''def clean_price_series(df: pd.DataFrame) -> pd.Series:
              if df is None or df.empty or "date" not in df.columns or "close" not in df.columns:
                  return pd.Series(dtype=float)
              out = df[["date", "close"]].copy()
              out["date"] = pd.to_datetime(out["date"]).dt.tz_localize(None).dt.normalize()
              out["close"] = pd.to_numeric(out["close"], errors="coerce")
              out = out.dropna(subset=["date", "close"]).drop_duplicates(subset=["date"]).sort_values("date")
              if out.empty:
                  return pd.Series(dtype=float)
              return pd.Series(out["close"].values, index=out["date"], dtype=float)
          ''',
          '''def clean_price_series(df: pd.DataFrame) -> pd.Series:
              if df is None or df.empty or "date" not in df.columns or "close" not in df.columns:
                  return pd.Series(dtype=float)
              out = df[["date", "close"]].copy()
              out["date"] = pd.to_datetime(out["date"]).dt.tz_localize(None).dt.normalize()
              out["close"] = pd.to_numeric(out["close"], errors="coerce").replace([np.inf, -np.inf], np.nan)
              out = out.dropna(subset=["date", "close"]).drop_duplicates(subset=["date"]).sort_values("date")
              out = out[out["close"] > 0]
              if out.empty:
                  return pd.Series(dtype=float)
              return pd.Series(out["close"].values, index=out["date"], dtype=float)
          ''',
          'clean_price_series')

          replace_once(
          '''        r = pd.to_numeric(returns, errors="coerce").dropna()
          ''',
          '''        r = pd.to_numeric(returns, errors="coerce").replace([np.inf, -np.inf], np.nan).dropna()
          ''',
          'ewma annual vol finite cleanup')

          replace_once(
          '''        df = returns.apply(pd.to_numeric, errors="coerce").dropna(how="any")
          ''',
          '''        df = returns.apply(pd.to_numeric, errors="coerce").replace([np.inf, -np.inf], np.nan).dropna(how="any")
          ''',
          'ewma covariance finite cleanup')

          replace_once(
          '''def merge_stock_meta(existing: Dict[str, Any], new_meta: Dict[str, Dict[str, Any]]) -> Dict[str, Any]:
              merged = dict(existing or {})
              for ticker, meta in new_meta.items():
                  old = merged.get(ticker, {})
                  if not isinstance(old, dict):
                      old = {}
                  merged[ticker] = {**old, **meta}
              return merged

def write_supabase_stock_meta(client, merged_stock_meta: Dict[str, Any]) -> None:
              if DRY_RUN:
                  print("DRY_RUN=true, not writing to Supabase.")
                  return
              try:
                  client.table(SUPABASE_TABLE).upsert({"id": int(PORTFOLIO_ROW_ID), "stock_meta": merged_stock_meta}, on_conflict="id").execute()
              except Exception as exc:
                  fail(f"Failed to write Supabase stock_meta: {exc}")
          ''',
          '''def merge_stock_meta(existing: Dict[str, Any], new_meta: Dict[str, Dict[str, Any]]) -> Dict[str, Any]:
              merged = dict(existing or {})
              for ticker, meta in new_meta.items():
                  old = merged.get(ticker, {})
                  if not isinstance(old, dict):
                      old = {}
                  merged[ticker] = {**old, **meta}
              return merged


def sanitize_json_value(value: Any) -> Any:
              """Recursively convert numpy scalars and non-finite floats into strict JSON values."""
              if isinstance(value, dict):
                  return {str(k): sanitize_json_value(v) for k, v in value.items()}
              if isinstance(value, (list, tuple)):
                  return [sanitize_json_value(v) for v in value]
              if isinstance(value, (np.bool_, bool)):
                  return bool(value)
              if isinstance(value, (np.integer,)):
                  return int(value)
              if isinstance(value, (np.floating, float)):
                  v = float(value)
                  return v if math.isfinite(v) else None
              if isinstance(value, pd.Timestamp):
                  return value.isoformat()
              return value


def write_supabase_stock_meta(client, merged_stock_meta: Dict[str, Any]) -> None:
              if DRY_RUN:
                  print("DRY_RUN=true, not writing to Supabase.")
                  return
              try:
                  safe_stock_meta = sanitize_json_value(merged_stock_meta)
                  client.table(SUPABASE_TABLE).upsert({"id": int(PORTFOLIO_ROW_ID), "stock_meta": safe_stock_meta}, on_conflict="id").execute()
              except Exception as exc:
                  fail(f"Failed to write Supabase stock_meta: {exc}")
          ''',
          'strict JSON Supabase write')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          python -m py_compile scripts/update_stock_meta.py
          python - <<'PY'
          import importlib.util
          import math
          import numpy as np
          import pandas as pd

          spec = importlib.util.spec_from_file_location('stock_meta_repair_test', 'scripts/update_stock_meta.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          payload = mod.sanitize_json_value({
              'nan': float('nan'),
              'pos_inf': float('inf'),
              'neg_inf': np.float64('-inf'),
              'ok': np.float64(1.25),
              'n': np.int64(7),
          })
          assert payload == {'nan': None, 'pos_inf': None, 'neg_inf': None, 'ok': 1.25, 'n': 7}, payload

          dates = pd.date_range('2025-01-01', periods=120, freq='D')
          asset = pd.DataFrame({'date': dates, 'close': np.linspace(100, 130, 120)})
          bench = pd.DataFrame({'date': dates, 'close': np.linspace(100, 120, 120)})
          asset.loc[20, 'close'] = 0.0
          asset.loc[40, 'close'] = np.inf
          beta, corr = mod.compute_beta_and_corr(asset, bench)
          assert beta is None or math.isfinite(beta), beta
          assert corr is None or math.isfinite(corr), corr

          dirty = pd.DataFrame({'date': dates[:4], 'close': [100.0, 0.0, np.inf, 101.0]})
          clean = mod.clean_price_series(dirty)
          assert (clean > 0).all()
          assert np.isfinite(clean.to_numpy()).all()

          ewma = mod.ewma_annual_vol(pd.Series([0.001] * 30 + [np.inf] + [0.002] * 30))
          assert ewma is None or math.isfinite(ewma), ewma
          print('non-finite stock_meta repair validated')
          PY

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-stock-meta-nonfinite-once.yml
          git add scripts/update_stock_meta.py
          git diff --cached --check
          git commit -m 'Sanitize non-finite stock quant metrics before Supabase write'
          git push origin HEAD:main

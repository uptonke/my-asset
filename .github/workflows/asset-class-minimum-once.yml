name: One-time asset class minimum weight update

on:
  push:
    paths:
      - '.github/workflows/asset-class-minimum-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply asset-class minimum-weight patch
        run: python scripts/patch_asset_class_min_weight_once.py

      - name: Validate Python and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_delegated_target_weight_draft_generator.py \
            scripts/build_delegated_target_weight_draft_guarded.py \
            scripts/individual_stock_risk_policy.py \
            tests/test_taiwan_individual_stock_risk_policy.py
          python -m unittest tests/test_taiwan_individual_stock_risk_policy.py
          git diff --check

      - name: Commit final implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/patch_asset_class_min_weight_once.py .github/workflows/asset-class-minimum-once.yml
          git add \
            config/manual_approval_override.json \
            scripts/build_delegated_target_weight_draft_generator.py \
            scripts/build_delegated_target_weight_draft_guarded.py \
            scripts/individual_stock_risk_policy.py \
            tests/test_taiwan_individual_stock_risk_policy.py
          git diff --cached --check
          git commit -m 'Use asset-class-specific minimum target weights'
          git push origin HEAD:main

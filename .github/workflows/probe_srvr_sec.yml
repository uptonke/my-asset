name: Probe SRVR SEC N-PORT fallback

on:
  push:
    branches:
      - test/srvr-sec-fallback-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and parse latest public SRVR N-PORT
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          USER_AGENT = "my-asset/1.0 https://github.com/uptonke/my-asset"
          # Latest public SRVR NPORT-P identified by SEC EDGAR series S000061573.
          accession = "0000894189-26-020691"
          accession_compact = accession.replace("-", "")
          cik = "1616668"
          url = f"https://www.sec.gov/Archives/edgar/data/{cik}/{accession_compact}/primary_doc.xml"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "application/xml,text/xml,*/*",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read()
              status = resp.status
              ct = resp.headers.get("content-type")
          root = ET.fromstring(raw)

          def lname(tag):
              return tag.split("}")[-1]

          values = {}
          for elem in root.iter():
              key = lname(elem.tag)
              if key in {"seriesName", "seriesId", "repPdDate", "repPdEnd", "regName"} and elem.text:
                  values.setdefault(key, elem.text.strip())

          investments = []
          for elem in root.iter():
              if lname(elem.tag) != "invstOrSec":
                  continue
              rec = {}
              for x in elem.iter():
                  key = lname(x.tag)
                  if x.text and key in {
                      "name", "title", "lei", "cusip", "ticker", "isin", "balance", "units",
                      "curCd", "valUSD", "pctVal", "assetCat", "issuerCat", "country",
                  }:
                      rec.setdefault(key, x.text.strip())
              if rec:
                  investments.append(rec)

          result = {
              "source": "SEC EDGAR NPORT-P",
              "url": url,
              "http_status": status,
              "content_type": ct,
              "bytes": len(raw),
              "accession": accession,
              "metadata": values,
              "investment_rows": len(investments),
              "sample": investments[:5],
              "fields_seen": sorted({k for r in investments for k in r}),
          }
          print(json.dumps(result, ensure_ascii=False, indent=2)[:20000])
          Path("srvr_sec_probe.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: srvr-sec-probe
          path: srvr_sec_probe.json
          if-no-files-found: error

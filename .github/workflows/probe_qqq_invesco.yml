name: Probe QQQ Invesco holdings

on:
  push:
    branches:
      - test/qqq-holdings-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe official QQQ holdings variants
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          base = (
              "https://dng-api.invesco.com/cache/v1/accounts/en_US/shareclasses/QQQ/"
              "holdings/fund?idType=ticker&interval=monthly&productType=ETF"
          )
          variants = {
              "initial": base + "&loadType=initial",
              "full_candidate": base,
          }
          out = {}
          for name, url in variants.items():
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 my-asset-holdings/1.0",
                      "Accept": "application/json,text/plain,*/*",
                      "Referer": "https://www.invesco.com/qqq-etf/en/about.html",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  status = resp.status
                  content_type = resp.headers.get("content-type")
              data = json.loads(raw.decode("utf-8", errors="replace"))
              holdings = data.get("holdings") if isinstance(data, dict) else None
              rec = {
                  "url": url,
                  "http_status": status,
                  "content_type": content_type,
                  "bytes": len(raw),
                  "effectiveDate": data.get("effectiveDate") if isinstance(data, dict) else None,
                  "effectiveBusinessDate": data.get("effectiveBusinessDate") if isinstance(data, dict) else None,
                  "totalNumberOfHoldings": data.get("totalNumberOfHoldings") if isinstance(data, dict) else None,
                  "returned_rows": len(holdings) if isinstance(holdings, list) else None,
                  "sample": holdings[:3] if isinstance(holdings, list) else None,
              }
              out[name] = rec
              print(name, json.dumps(rec, ensure_ascii=False, indent=2))

          Path("qqq_variants_probe.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqq-variants-probe
          path: qqq_variants_probe.json
          if-no-files-found: error

name: Probe QQQ Invesco holdings

on:
  push:
    branches:
      - test/qqq-holdings-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe direct official QQQ holdings endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = (
              "https://dng-api.invesco.com/cache/v1/accounts/en_US/shareclasses/QQQ/"
              "holdings/fund?idType=ticker&interval=monthly&productType=ETF&loadType=initial"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 my-asset-holdings/1.0",
                  "Accept": "application/json,text/plain,*/*",
                  "Referer": "https://www.invesco.com/qqq-etf/en/about.html",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read()
              status = resp.status
              content_type = resp.headers.get("content-type")

          text = raw.decode("utf-8", errors="replace")
          print("HTTP status:", status)
          print("Content-Type:", content_type)
          print("Bytes:", len(raw))
          print("Body prefix:", text[:300].replace("\n", " "))

          result = {
              "source": "Invesco official DNG API",
              "url": url,
              "http_status": status,
              "content_type": content_type,
              "bytes": len(raw),
          }

          try:
              data = json.loads(text)
              result["json_type"] = type(data).__name__
              if isinstance(data, dict):
                  result["top_level_keys"] = sorted(data.keys())
                  # Describe likely list-valued fields without dumping the full response to logs.
                  lists = {}
                  for k, v in data.items():
                      if isinstance(v, list):
                          lists[k] = {
                              "rows": len(v),
                              "sample": v[:3],
                              "sample_keys": sorted(v[0].keys()) if v and isinstance(v[0], dict) else [],
                          }
                  result["list_fields"] = lists
                  result["sample"] = {k: v for k, v in data.items() if not isinstance(v, list)}
              elif isinstance(data, list):
                  result["rows"] = len(data)
                  result["sample"] = data[:3]
                  result["sample_keys"] = sorted(data[0].keys()) if data and isinstance(data[0], dict) else []
              else:
                  result["sample"] = data
          except Exception as exc:
              result["json_error"] = f"{type(exc).__name__}: {exc}"
              result["body_prefix"] = text[:2000]

          Path("qqq_direct_probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqq-direct-probe
          path: qqq_direct_probe.json
          if-no-files-found: error

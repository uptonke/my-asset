name: One-time TWR NAV trend split

on:
  push:
    paths:
      - '.github/workflows/twr-nav-trend-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TWR NAV trend patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_twr_nav_trend_once.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('class=\\\\\\"terminal-chip\\\\\\"', 'class="terminal-chip"')
          s = s.replace('class=\\\\\\"terminal-chip border-cyan-500/30 bg-cyan-500/10 text-cyan-200\\\\\\"', 'class="terminal-chip border-cyan-500/30 bg-cyan-500/10 text-cyan-200"')
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/patch_twr_nav_trend_once.py

      - name: Rebuild and validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -F "function navTrendTwrIndexPoints()" assets/js/src/app.bundle.source.js
          grep -F "label: 'TWR Drawdown'" assets/js/src/app.bundle.source.js
          grep -F "nav: 'Raw NAV'" assets/js/src/app.bundle.source.js
          grep -F "TWR vs 3M MA" index.html
          grep -F "Flow-adjusted TWR" index.html
          grep -F "assets/js/app.bundle.js?v=twr-trend-v1" index.html
          python - <<'PY'
          from pathlib import Path
          s = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          required = [
              "const periodReturn = prev.nav > 0",
              "((curr.nav - externalFlow) / prev.nav) - 1",
              "const points = navTrendTwrIndexPoints();",
              "latest.value / peakIndex - 1",
              "navOverlayMode.value === 'drawdown'",
              "navOverlayMode.value === 'both'",
          ]
          for needle in required:
              assert needle in s, needle
          assert "latest.nav / peakNav - 1" not in s
          print('Static TWR trend assertions passed')
          PY
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('assets/js/src/app.bundle.source.js', 'utf8');
          const start = src.indexOf('function navTrendParseDate');
          const end = src.indexOf('const navTrendSummary = computed', start);
          if (start < 0 || end < 0) throw new Error('TWR helper segment missing');
          const displayHistory = { value: [
            { date: '2025-01-01', assets: 100 },
            { date: '2025-02-01', assets: 150 },
            { date: '2025-03-01', assets: 105 },
            { date: '2025-04-01', assets: 115.5 },
          ] };
          const transactions = { value: [
            { type: 'Deposit', date: '2025-02-01', totalCashFlow: 50 },
            { type: 'Withdraw', date: '2025-03-01', totalCashFlow: -45 },
          ] };
          eval(src.slice(start, end) + '\nglobalThis.__twrFns = { navTrendTwrIndexPoints, navTrendShiftMonths, navTrendMovingAverage };');
          const f = globalThis.__twrFns;
          const p = f.navTrendTwrIndexPoints();
          if (p.length !== 4) throw new Error(`expected 4 TWR points, got ${p.length}`);
          if (Math.abs(p[1].value - 100) > 1e-9) throw new Error('deposit changed TWR index');
          if (Math.abs(p[2].value - 100) > 1e-9) throw new Error('withdrawal changed TWR index');
          if (Math.abs(p[3].value - 110) > 1e-9) throw new Error(`10% investment return not captured: ${p[3].value}`);

          // Long enough history should produce 3M/12M moving averages.
          displayHistory.value = [];
          transactions.value = [];
          for (let m = 0; m < 18; m += 1) {
            const d = new Date(Date.UTC(2025, m, 1));
            displayHistory.value.push({ date: d.toISOString().slice(0, 10), assets: 100 + m * 2 });
          }
          const long = f.navTrendTwrIndexPoints();
          const latest = long[long.length - 1];
          const ma3 = f.navTrendMovingAverage(long, latest.ts, 3);
          const ma12 = f.navTrendMovingAverage(long, latest.ts, 12);
          if (!(Number.isFinite(ma3) && Number.isFinite(ma12))) throw new Error('3M/12M TWR MA should be finite');
          console.log('Flow-adjusted TWR helper tests passed');
          NODE
          git diff --check

      - name: Commit final fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          git rm -f scripts/patch_twr_nav_trend_once.py .github/workflows/twr-nav-trend-once.yml
          git add assets/js/src/app.bundle.source.js assets/js/app.bundle.js index.html
          git diff --cached --check
          git commit -m 'Split raw NAV scale from flow-adjusted TWR trend'
          git push origin HEAD:main

name: One-time export menu UI fix

on:
  push:
    paths:
      - '.github/workflows/export-menu-ui-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive export menu polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/10-components.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* ===== Portfolio export menu v2 responsive flow ===== */'
          if marker in text:
              raise SystemExit('v2 responsive export menu styles already present')
          text += r'''

/* ===== Portfolio export menu v2 responsive flow ===== */
.portfolio-export-item:nth-child(1) > i { color: #c4b5fd; }
.portfolio-export-item:nth-child(2) > i { color: #fca5a5; }
.portfolio-export-item:nth-child(3) > i { color: #86efac; }
.portfolio-export-item:nth-child(4) > i { color: #93c5fd; }

@media (min-width: 1024px) {
    .portfolio-export-popover {
        width: 244px;
        padding: 0.32rem;
    }

    .portfolio-export-item {
        padding: 0.62rem 0.68rem;
        gap: 0.55rem;
    }
}

@media (max-width: 1023px) {
    .portfolio-export-menu[open] {
        display: contents;
    }

    .portfolio-export-menu[open] > summary {
        position: relative;
        z-index: 2;
    }

    .portfolio-export-menu[open] .portfolio-export-popover {
        position: static;
        flex: 1 0 100%;
        order: 50;
        width: 100%;
        margin-top: 0.3rem;
        padding: 0.42rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.35rem;
        border-radius: 14px;
        background: rgba(8, 15, 30, 0.72);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    .portfolio-export-menu[open] .portfolio-export-item {
        min-width: 0;
        min-height: 58px;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 0.5rem;
        padding: 0.58rem 0.62rem;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.025);
        border-radius: 11px;
    }

    .portfolio-export-menu[open] .portfolio-export-item strong {
        font-size: 0.72rem;
    }

    .portfolio-export-menu[open] .portfolio-export-item small {
        font-size: 0.58rem;
        line-height: 1.3;
    }
}

@media (max-width: 480px) {
    .portfolio-export-menu[open] .portfolio-export-popover {
        gap: 0.3rem;
        padding: 0.35rem;
    }

    .portfolio-export-menu[open] .portfolio-export-item {
        min-height: 48px;
        padding: 0.52rem 0.56rem;
    }

    .portfolio-export-menu[open] .portfolio-export-item small {
        display: none;
    }
}
'''
          p.write_text(text, encoding='utf-8')
          PY
          grep -q 'Portfolio export menu v2 responsive flow' assets/css/10-components.css
          git diff --check

      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/export-menu-ui-fix-once.yml
          git add assets/css/10-components.css
          git diff --cached --check
          git commit -m 'Fix responsive portfolio export menu layout'
          git push origin HEAD:main

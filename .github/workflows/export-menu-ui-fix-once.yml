name: One-time export menu UI fix

on:
  push:
    paths:
      - '.github/workflows/export-menu-ui-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive export menu polish
        run: python scripts/patch_export_menu_ui_once.py

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Portfolio export menu v2 responsive flow' assets/css/10-components.css
          grep -q 'display: contents' assets/css/10-components.css
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' assets/css/10-components.css
          git diff --check

      - name: Commit and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/export-menu-ui-fix-once.yml scripts/patch_export_menu_ui_once.py
          git add assets/css/10-components.css
          git diff --cached --check
          git commit -m 'Fix responsive portfolio export menu layout'
          git push origin HEAD:main

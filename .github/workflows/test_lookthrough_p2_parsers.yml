name: Test Lookthrough P2 Parsers
on:
  push:
    branches: [work/lookthrough-p2-20260809]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate six new look-through sources
        run: |
          python - <<'PY'
          import csv, io, json, re, requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 my-asset-holdings/1.0','Accept':'*/*'})
          def n(v):
              try:return float(str(v or '').strip().replace('$','').replace(',','').replace('%',''))
              except:return None
          def w(v):
              x=n(v); return None if x is None else x/100
          def ok(name,rows):
              rows=[x for x in rows if x[0] is not None]; cov=sum(x[0] for x in rows)
              assert len(rows)>=10,(name,len(rows)); assert .8<=cov<=1.2,(name,cov)
              print(f'{name}: rows={len(rows)} coverage={cov*100:.2f}%'); return len(rows),cov

          for fund in ['VOO','VEA']:
              base=f'https://investor.vanguard.com/investment-products/etfs/profile/api/{fund}/portfolio-holding/stock'
              start=1; raw=[]; size=None; asof=None
              while True:
                  r=s.get(base,params={'start':start,'count':500},timeout=35); r.raise_for_status(); d=r.json()
                  size=int(d['size']); asof=d['asOfDate']; page=(d.get('fund') or {}).get('entity') or []; raw += page
                  if len(raw)>=size or len(page)<500: break
                  start += len(page)
              count,_=ok(fund,[(w(x.get('percentWeight')),x.get('ticker')) for x in raw]); assert count==size
              print(' ',asof,'reported=',size)

          for fund,pid,slug in [('USMV','239695','ishares-msci-usa-minimum-volatility-etf'),('PICK','239655','ishares-msci-global-metals-mining-producers-etf')]:
              u=f'https://www.ishares.com/us/products/{pid}/{slug}/latest-holdings.csv'; r=s.get(u,timeout=35); r.raise_for_status()
              lines=r.content.decode('utf-8-sig','replace').splitlines(); hi=next(i for i,x in enumerate(lines) if x.startswith('Ticker,'))
              rows=csv.DictReader(io.StringIO('\n'.join(lines[hi:]))); ok(fund,[(w(x.get('Weight (%)')),x.get('Ticker')) for x in rows])
              print(' ',lines[1])

          def balanced(text,marker):
              mi=text.find(marker); assert mi>=0; st=text.find('[',mi+len(marker)-1); dep=0; ins=False; esc=False
              for i in range(st,len(text)):
                  ch=text[i]
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True
                  elif ch=='[':dep+=1
                  elif ch==']':
                      dep-=1
                      if dep==0:return text[st:i+1]
              raise AssertionError('array')
          def objects(a):
              out=[]; dep=0; st=None; ins=False; esc=False
              for i,ch in enumerate(a):
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True
                  elif ch=='{':
                      if dep==0:st=i
                      dep+=1
                  elif ch=='}':
                      dep-=1
                      if dep==0 and st is not None:out.append(a[st:i+1]);st=None
              return out
          def field(o,k):
              m=re.search(rf'(?:^|,)\s*{re.escape(k)}:"((?:\\.|[^"\\])*)"',o)
              if not m:return ''
              try:return json.loads('"'+m.group(1)+'"')
              except:return m.group(1)
          u='https://www.avantisinvestors.com/avantis-investments/avantis-us-small-cap-value-etf/'; r=s.get(u,timeout=35); r.raise_for_status(); html=r.text
          parsed=[(w(field(o,'weight')),field(o,'ticker')) for o in objects(balanced(html,'etfHoldings:[')) if w(field(o,'weight')) is not None]
          count,cov=ok('AVUV',parsed); reported=int(re.search(r'numberOfHoldings:"([\d,]+)"',html).group(1).replace(',',''))
          assert count>=780 and reported>=count and cov>.99; print('  reported=',reported,'weighted_rows=',count,'date=',re.search(r'etfHoldingsAsOfDate:"([^"]+)"',html).group(1))

          u='https://www.etfinfo.tw/etf/00981A/holdings'; r=s.get(u,timeout=35); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser'); p=None
          for sc in soup.find_all('script'):
              t=sc.string or sc.get_text('',strip=False) or ''
              if 'etf-detail-base-00981A' not in t or 'ShallowReactive' not in t:continue
              try:c=json.loads(t)
              except:continue
              if isinstance(c,list):p=c;break
          assert p
          def ref(x): return p[x] if isinstance(x,int) and not isinstance(x,bool) and 0<=x<len(p) else x
          root=ref(p[0][1]); tag=ref(root['data']); data=ref(tag[1]); detail=ref(data['etf-detail-base-00981A']); snap=ref(detail['holdings']); raw=ref(snap['holdings'])
          rows=[]; deriv=0
          for rr in raw:
              o=ref(rr); ticker=str(ref(o.get('code')) or ''); name=str(ref(o.get('name')) or ''); weight=ref(o.get('weight'))
              if ticker=='TX' or '期貨' in name: deriv+=1
              try:rows.append((float(weight)/100,ticker))
              except:pass
          count,cov=ok('00981A',rows); asof=ref(ref(detail['latestMarket'])['date'])
          assert count==51 and deriv>=1; print(' ',asof,'derivatives=',deriv)
          PY

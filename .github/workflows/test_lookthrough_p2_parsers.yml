name: Test Lookthrough P2 Parsers

on:
  push:
    branches: [work/lookthrough-p2-20260809]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate live source parsers
        run: |
          python - <<'PY'
          import csv, io, json, re, requests
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 my-asset-holdings/1.0','Accept':'*/*'}
          s=requests.Session(); s.headers.update(H)
          def num(v):
              t=str(v or '').strip().replace('$','').replace(',','').replace('%','')
              try:return float(t)
              except:return None
          def wd(v):
              n=num(v); return None if n is None else n/100
          def finalize(name, rows):
              rows=[r for r in rows if r[0] is not None]
              cov=sum(r[0] for r in rows)
              assert len(rows)>=10, (name,len(rows))
              assert .8 <= cov <= 1.2, (name,cov)
              print(name,'rows=',len(rows),'coverage=',round(cov*100,4))

          # Vanguard exact pagination/parser shape.
          for fund in ['VOO','VEA']:
              start=1; raw=[]; size=None; asof=None
              while True:
                  u=f'https://investor.vanguard.com/investment-products/etfs/profile/api/{fund}/portfolio-holding/stock'
                  r=s.get(u,params={'start':start,'count':500},timeout=35); r.raise_for_status(); d=r.json()
                  size=int(d.get('size')); asof=d.get('asOfDate'); page=((d.get('fund') or {}).get('entity') or [])
                  raw.extend(page)
                  if len(raw)>=size or len(page)<500: break
                  start += len(page)
              finalize(fund, [(wd(x.get('percentWeight')),x.get('ticker')) for x in raw])
              assert len(raw)==size
              print(' ',asof,'reported=',size)

          # iShares USMV/PICK exact CSV shape.
          for fund,pid,slug in [('USMV','239695','ishares-msci-usa-minimum-volatility-etf'),('PICK','239655','ishares-msci-global-metals-mining-producers-etf')]:
              u=f'https://www.ishares.com/us/products/{pid}/{slug}/latest-holdings.csv'
              r=s.get(u,timeout=35); r.raise_for_status(); lines=r.content.decode('utf-8-sig','replace').splitlines()
              hi=next(i for i,x in enumerate(lines) if x.startswith('Ticker,')); rows=csv.DictReader(io.StringIO('\n'.join(lines[hi:])))
              parsed=[(wd(x.get('Weight (%)')),x.get('Ticker')) for x in rows if wd(x.get('Weight (%)')) is not None]
              finalize(fund,parsed)
              print('  ',lines[1])

          # Avantis exact embedded-array parser.
          def extract_arr(text,marker):
              mi=text.find(marker); assert mi>=0
              st=text.find('[',mi+len(marker)-1); assert st>=0
              dep=0; ins=False; esc=False
              for i in range(st,len(text)):
                  ch=text[i]
                  if ins:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True
                  elif ch=='[': dep+=1
                  elif ch==']':
                      dep-=1
                      if dep==0:return text[st:i+1]
              raise AssertionError('unterminated')
          def split_obj(a):
              out=[]; dep=0; st=None; ins=False; esc=False
              for i,ch in enumerate(a):
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True
                  elif ch=='{':
                      if dep==0:st=i
                      dep+=1
                  elif ch=='}':
                      dep-=1
                      if dep==0 and st is not None:out.append(a[st:i+1]);st=None
              return out
          def jsf(o,k):
              m=re.search(rf'(?:^|,)\s*{re.escape(k)}:"((?:\\.|[^"\\])*)"',o)
              if not m:return ''
              try:return json.loads('"'+m.group(1)+'"')
              except:return m.group(1)
          u='https://www.avantisinvestors.com/avantis-investments/avantis-us-small-cap-value-etf/'
          r=s.get(u,timeout=35); r.raise_for_status(); html=r.text
          objs=split_obj(extract_arr(html,'etfHoldings:['))
          parsed=[(wd(jsf(o,'weight')),jsf(o,'ticker')) for o in objs if wd(jsf(o,'weight')) is not None]
          finalize('AVUV',parsed)
          cm=re.search(r'numberOfHoldings:"([\d,]+)"',html); reported=int(cm.group(1).replace(',',''))
          assert len(parsed)==reported,(len(parsed),reported)
          print('  reported=',reported,'date=',re.search(r'etfHoldingsAsOfDate:"([^"]+)"',html).group(1))

          # 00981A exact Nuxt ref parser.
          u='https://www.etfinfo.tw/etf/00981A/holdings'; r=s.get(u,timeout=35); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          payload=None
          for sc in soup.find_all('script'):
              txt=sc.string or sc.get_text('',strip=False) or ''
              if 'etf-detail-base-00981A' not in txt or 'ShallowReactive' not in txt: continue
              try:c=json.loads(txt)
              except:continue
              if isinstance(c,list):payload=c;break
          assert payload
          ref=lambda x: payload[x] if isinstance(x,int) and 0<=x<len(payload) else x
          rt=payload[0]; root=ref(rt[1]); dt=ref(root.get('data')); data=ref(dt[1]) if isinstance(dt,list) and len(dt)>=2 and dt[0]=='ShallowReactive' else dt
          detail=ref(data.get('etf-detail-base-00981A')); raw=ref(detail.get('holdings'))
          parsed=[]; deriv=0
          for href in raw:
              o=ref(href); ticker=str(ref(o.get('code')) or ''); name=str(ref(o.get('name')) or ''); w=wd(ref(o.get('weight')))
              if ticker=='TX' or '期貨' in name: deriv+=1
              if w is not None: parsed.append((w,ticker))
          finalize('00981A',parsed)
          assert len(parsed)==51,(len(parsed),len(raw)); assert deriv>=1
          lm=ref(detail.get('latestMarket')); print('  date=',ref(lm.get('date')),'derivatives=',deriv)
          PY

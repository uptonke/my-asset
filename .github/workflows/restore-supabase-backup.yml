name: Verify or Restore Private Portfolio Backup
on:
  workflow_dispatch:
    inputs:
      object_path:
        description: 'Encrypted object path portfolio/v1/...enc'
        required: true
        type: string
      mode:
        description: 'Verify only or restore existing empty row'
        type: choice
        options:
          - verify
          - restore-empty
        default: verify
      confirm:
        description: 'For restore-empty type RESTORE_EMPTY'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: private-performance-attribution
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PORTFOLIO_BACKUP_KEY: ${{ secrets.PORTFOLIO_BACKUP_KEY }}
      PORTFOLIO_ROW_ID: '1'
      OBJECT_PATH: ${{ inputs.object_path }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'supabase>=2.7,<3' 'cryptography>=44,<48'
      - run: python scripts/private_portfolio_backup.py "$MODE" --object "$OBJECT_PATH" --confirm "$CONFIRM"

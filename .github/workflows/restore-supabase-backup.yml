name: Verify or Restore GitHub Portfolio Backup
on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: 'Backup date (YYYY-MM-DD)'
        required: true
        type: string
      mode:
        description: 'Verify only or restore existing empty row'
        type: choice
        options:
          - verify
          - restore-empty
        default: verify
      confirm:
        description: 'For restore-empty type RESTORE_EMPTY'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: private-performance-attribution
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_DATE: ${{ inputs.backup_date }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'supabase>=2.7,<3'
      - run: python scripts/restore_supabase_backup.py --backup-date "$BACKUP_DATE" --mode "$MODE" --confirm "$CONFIRM"

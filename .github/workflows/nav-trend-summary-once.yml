name: One-time NAV trend summary fix

on:
  push:
    paths:
      - '.github/workflows/nav-trend-summary-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply NAV trend summary patch
        run: python scripts/patch_nav_trend_summary_once.py

      - name: Rebuild and validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -F "function navTrendMovingAverage(points, endTs, months)" assets/js/src/app.bundle.source.js
          grep -F "navTrendFormatRatio(latest.nav / ma3m - 1)" assets/js/src/app.bundle.source.js
          grep -F "navTrendFormatRatio(ma12m / priorMa12m - 1, ' / 月')" assets/js/src/app.bundle.source.js
          grep -F "navTrendFormatRatio(latest.nav / peakNav - 1)" assets/js/src/app.bundle.source.js
          if grep -Fq "navVsMonth: 'N/A',\n                navVsYear: 'N/A',\n                monthSlope: 'N/A',\n                yearSlope: 'N/A',\n                currentDrawdown: syntheticRiskMeta" assets/js/src/app.bundle.source.js; then
            echo 'stale hard-coded NAV trend placeholder remains' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('assets/js/src/app.bundle.source.js', 'utf8');
          const start = src.indexOf('function navTrendParseDate');
          const end = src.indexOf('const navTrendSummary = computed', start);
          if (start < 0 || end < 0) throw new Error('NAV trend helper segment missing');
          const displayHistory = { value: [] };
          eval(src.slice(start, end) + '\nglobalThis.__navTrendFns = { navTrendParseDate, navTrendHistoryPoints, navTrendShiftMonths, navTrendMovingAverage, navTrendFormatRatio };');
          const f = globalThis.__navTrendFns;
          const startDate = new Date(Date.UTC(2025, 0, 1));
          for (let i = 0; i <= 650; i += 7) {
            const d = new Date(startDate.getTime() + i * 86400000);
            displayHistory.value.push({
              date: d.toISOString().slice(0, 10),
              assets: 500000 + i * 250
            });
          }
          const points = f.navTrendHistoryPoints();
          const latest = points[points.length - 1];
          const ma3 = f.navTrendMovingAverage(points, latest.ts, 3);
          const ma12 = f.navTrendMovingAverage(points, latest.ts, 12);
          const prevEnd = f.navTrendShiftMonths(latest.ts, -1);
          const prev3 = f.navTrendMovingAverage(points, prevEnd, 3);
          const prev12 = f.navTrendMovingAverage(points, prevEnd, 12);
          for (const [name, value] of Object.entries({ ma3, ma12, prev3, prev12 })) {
            if (!(Number.isFinite(value) && value > 0)) throw new Error(`${name} should be finite`);
          }
          if (!(ma3 > prev3 && ma12 > prev12)) throw new Error('moving-average slopes should be positive on rising sample');
          if (!/^\+/.test(f.navTrendFormatRatio(0.0123))) throw new Error('positive ratio should show + sign');
          displayHistory.value = displayHistory.value.slice(-8);
          const shortPoints = f.navTrendHistoryPoints();
          const shortLatest = shortPoints[shortPoints.length - 1];
          if (f.navTrendMovingAverage(shortPoints, shortLatest.ts, 12) !== null) throw new Error('insufficient 12M history should return null');
          console.log('NAV trend helper tests passed');
          NODE
          git diff --check

      - name: Commit final fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          git rm -f scripts/patch_nav_trend_summary_once.py .github/workflows/nav-trend-summary-once.yml
          git add assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Calculate NAV moving-average trend summary'
          git push origin HEAD:main

name: One-time TWR detrend diagnostic implementation

on:
  push:
    paths:
      - '.github/workflows/add-twr-detrend-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TWR detrend patch
        run: python scripts/add_twr_detrend_once.py

      - name: Build canonical frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_frontend_bundle.py --check
          node --check assets/js/src/app.bundle.source.js
          node --check assets/js/app.bundle.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          src = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          runtime = Path('assets/js/app.bundle.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          assert src == runtime
          required_src = [
              'function navTrendDetrendPoints()',
              'function navTrendDeviationWindowStats',
              'const twrDetrendSummary = computed',
              "document.getElementById('twrDetrendChart')",
              "label: 'TWR 去趨勢偏離'",
              'chartDetrend',
              'twrDetrendSummary,',
              'watch([displayHistory, transactions], () => updateCharts()'
          ]
          for token in required_src:
              assert token in src, token

          required_index = [
              'TWR 去趨勢診斷（12M）',
              '目前 TWR Index',
              '12M Trend',
              '偏離長期趨勢',
              '偏離 Z-score',
              'twrDetrendChart',
              '這是診斷工具，不是買賣訊號',
              'app.bundle.js?v=twr-detrend-v1'
          ]
          for token in required_index:
              assert token in index, token

          # Sanity-check the intended detrend math on a deterministic series.
          points = [100, 102, 104, 106, 108]
          trend = 104
          deviation = points[-1] / trend - 1
          assert round(deviation * 100, 6) == round((108 / 104 - 1) * 100, 6)

          print('TWR detrend static and math sanity checks passed')
          PY

      - name: Commit final implementation and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/add-twr-detrend-once.yml scripts/add_twr_detrend_once.py
          git add assets/js/src/app.bundle.source.js assets/js/app.bundle.js index.html data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md
          git diff --cached --check
          git commit -m 'Add flow-adjusted TWR detrend diagnostic'
          git push origin HEAD:main

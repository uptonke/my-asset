name: One-time Gemini 3.8 insight upgrade

on:
  push:
    paths:
      - '.github/workflows/gemini38-guardrails-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade Gemini models, reasoning config, and evidence guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('main.py')
          compass_path = Path('scripts/update_market_compass.py')
          main = main_path.read_text(encoding='utf-8')
          compass = compass_path.read_text(encoding='utf-8')

          def replace_required(text, old, new, label, expected_min=1):
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f'{label}: expected >= {expected_min}, found {count}')
              return text.replace(old, new)

          # Current google-genai SDK supports thinking_level for Gemini 3/4 and
          # thinking_budget for legacy Gemini 2.5. Keep fallback configuration valid.
          main = replace_required(
              main,
              'from google import genai\n',
              'from google import genai\nfrom google.genai import types\n',
              'main google.genai import',
          )

          helper_anchor = "warnings.filterwarnings('ignore')\n"
          helper = r'''warnings.filterwarnings('ignore')


def generate_gemini_json(client, model_name, prompt):
    """Generate JSON with model-compatible reasoning controls."""
    if str(model_name).startswith(("gemini-3", "gemini-4")):
        config = types.GenerateContentConfig(
            response_mime_type="application/json",
            thinking_config=types.ThinkingConfig(thinking_level="high"),
        )
    else:
        # Gemini 2.5 does not support thinking_level; retain dynamic thinking.
        config = types.GenerateContentConfig(
            response_mime_type="application/json",
            thinking_config=types.ThinkingConfig(thinking_budget=-1),
        )
    return client.models.generate_content(model=model_name, contents=prompt, config=config)
'''
          if 'def generate_gemini_json(' not in main:
              if helper_anchor not in main:
                  raise SystemExit('Gemini helper anchor not found')
              main = main.replace(helper_anchor, helper, 1)

          old_models = '["gemini-3-flash-preview", "gemini-2.5-flash", "gemini-2.0-flash"]'
          new_models = '["gemini-3.8-flash", "gemini-3.6-flash", "gemini-2.5-flash"]'
          model_count = main.count(old_models)
          if model_count < 1:
              raise SystemExit(f'legacy Gemini fallback list not found; count={model_count}')
          main = main.replace(old_models, new_models)

          old_call = 'client.models.generate_content(model=model_name, contents=prompt)'
          call_count = main.count(old_call)
          if call_count < 1:
              raise SystemExit(f'Gemini generate call not found; count={call_count}')
          main = main.replace(old_call, 'generate_gemini_json(client, model_name, prompt)')

          guardrails = '''[EVIDENCE_GUARDRAILS]\n            Quantitative evidence outranks narrative. Follow these rules strictly:\n            - Sys Corr < 0.30 means low cross-asset correlation / stronger diversification. Never call it correlation collapse, market-structure breakdown, or Beta failure.\n            - Sys Corr alone can never establish Beta failure. Only discuss Beta/factor failure when explicit beta or factor-model diagnostics support it.\n            - If Alpha p-value is absent OR p >= 0.10, do not claim an Alpha edge, persistent Alpha, high-Alpha opportunity, or ability to extract Alpha. If an estimate is supplied, call it an unproven point estimate.\n            - If factor-model R-squared >= 0.80, do not describe Beta/systematic factors as ineffective or failed.\n            - Z-score language: abs(Z) < 1 = near normal; 1 <= abs(Z) < 2 = elevated; abs(Z) >= 2 = unusually high/extreme. A single Z-score never proves forced liquidation, deleveraging, or a carry unwind.\n            - Forced liquidation / deleveraging / carry unwind requires at least TWO independent confirming stress signals. Otherwise say risk is elevated or consistent with stress, not that liquidation is occurring.\n            - Relative momentum is relative performance, not an absolute crash. Do not use bloodbath/crash language unless an absolute drawdown metric confirms it.\n            - Positive RSP/SPY means improving market breadth / equal-weight leadership. Do not automatically call it small-cap leadership.\n            - Use measured language. Avoid 崩潰、失效、強行榨取、血洗、暴力殺盤 unless the supplied quantitative evidence explicitly meets the rules above.\n\n            '''

          # Add the same evidence constraints to every structured Gemini summary prompt in main.py.
          if '[EVIDENCE_GUARDRAILS]' not in main:
              output_schema_count = main.count('[OUTPUT_SCHEMA]')
              if output_schema_count < 1:
                  raise SystemExit('No OUTPUT_SCHEMA prompt anchors found')
              main = main.replace('[OUTPUT_SCHEMA]', guardrails + '[OUTPUT_SCHEMA]')

          # Market Compass: use the same stable primary model and model-compatible high thinking.
          compass = replace_required(
              compass,
              'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-2.5-flash")',
              'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-3.8-flash")',
              'market compass default model',
          )
          compass = replace_required(
              compass,
              '        from google import genai\n        client = genai.Client(api_key=GEMINI_API_KEY)\n        response = client.models.generate_content(model=GEMINI_MODEL, contents=prompt)',
              '        from google import genai\n        from google.genai import types\n        client = genai.Client(api_key=GEMINI_API_KEY)\n        if str(GEMINI_MODEL).startswith(("gemini-3", "gemini-4")):\n            gemini_config = types.GenerateContentConfig(\n                response_mime_type="application/json",\n                thinking_config=types.ThinkingConfig(thinking_level="high"),\n            )\n        else:\n            gemini_config = types.GenerateContentConfig(\n                response_mime_type="application/json",\n                thinking_config=types.ThinkingConfig(thinking_budget=-1),\n            )\n        response = client.models.generate_content(model=GEMINI_MODEL, contents=prompt, config=gemini_config)',
              'market compass Gemini call',
          )

          main_path.write_text(main, encoding='utf-8')
          compass_path.write_text(compass, encoding='utf-8')
          PY

      - name: Validate Gemini upgrade
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py scripts/update_market_compass.py
          git diff --check
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py').read_text(encoding='utf-8')
          compass = Path('scripts/update_market_compass.py').read_text(encoding='utf-8')

          assert '"gemini-3.8-flash", "gemini-3.6-flash", "gemini-2.5-flash"' in main
          assert 'gemini-3-flash-preview' not in main
          assert 'gemini-2.0-flash' not in main
          assert 'thinking_level="high"' in main
          assert 'thinking_budget=-1' in main
          assert 'response_mime_type="application/json"' in main
          assert '[EVIDENCE_GUARDRAILS]' in main
          assert 'Sys Corr < 0.30 means low cross-asset correlation' in main
          assert 'If Alpha p-value is absent OR p >= 0.10' in main
          assert 'If factor-model R-squared >= 0.80' in main
          assert 'requires at least TWO independent confirming stress signals' in main
          assert 'Positive RSP/SPY means improving market breadth' in main

          assert 'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-3.8-flash")' in compass
          assert 'thinking_level="high"' in compass
          assert 'thinking_budget=-1' in compass
          assert 'response_mime_type="application/json"' in compass
          assert 'gemini-2.0-flash' not in compass
          print('Gemini 3.8 model + evidence guardrail assertions passed')
          PY

      - name: Commit final change and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/gemini38-guardrails-once.yml
          git add main.py scripts/update_market_compass.py
          git diff --cached --check
          git commit -m 'Upgrade Gemini insight model and evidence guardrails'
          git push origin HEAD:main

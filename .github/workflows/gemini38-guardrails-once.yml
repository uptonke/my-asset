name: One-time Gemini 3.8 insight upgrade

on:
  push:
    paths:
      - '.github/workflows/gemini38-guardrails-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade Gemini models, reasoning config, and evidence guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('main.py')
          compass_path = Path('scripts/update_market_compass.py')
          main = main_path.read_text(encoding='utf-8')
          compass = compass_path.read_text(encoding='utf-8')

          def replace_required(text, old, new, label):
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{label}: anchor not found')
              return text.replace(old, new)

          main = replace_required(main, 'from google import genai\n', 'from google import genai\nfrom google.genai import types\n', 'main google.genai import')

          helper_anchor = "warnings.filterwarnings('ignore')\n"
          helper_lines = [
              "warnings.filterwarnings('ignore')", "", "",
              "def generate_gemini_json(client, model_name, prompt):",
              "    \"\"\"Generate JSON with model-compatible reasoning controls.\"\"\"",
              "    if str(model_name).startswith((\"gemini-3\", \"gemini-4\")):",
              "        config = types.GenerateContentConfig(",
              "            response_mime_type=\"application/json\",",
              "            thinking_config=types.ThinkingConfig(thinking_level=\"high\"),",
              "        )",
              "    else:",
              "        # Gemini 2.5 does not support thinking_level; retain dynamic thinking.",
              "        config = types.GenerateContentConfig(",
              "            response_mime_type=\"application/json\",",
              "            thinking_config=types.ThinkingConfig(thinking_budget=-1),",
              "        )",
              "    return client.models.generate_content(model=model_name, contents=prompt, config=config)",
              "",
          ]
          helper = '\n'.join(helper_lines)
          if 'def generate_gemini_json(' not in main:
              if helper_anchor not in main:
                  raise SystemExit('Gemini helper anchor not found')
              main = main.replace(helper_anchor, helper, 1)

          old_models = '["gemini-3-flash-preview", "gemini-2.5-flash", "gemini-2.0-flash"]'
          new_models = '["gemini-3.8-flash", "gemini-3.6-flash", "gemini-2.5-flash"]'
          if old_models not in main:
              raise SystemExit('legacy Gemini fallback list not found')
          main = main.replace(old_models, new_models)

          old_call = 'client.models.generate_content(model=model_name, contents=prompt)'
          if old_call not in main:
              raise SystemExit('Gemini generate call not found')
          main = main.replace(old_call, 'generate_gemini_json(client, model_name, prompt)')

          guardrail_lines = [
              '[EVIDENCE_GUARDRAILS]',
              'Quantitative evidence outranks narrative. Follow these rules strictly:',
              '- Sys Corr < 0.30 means low cross-asset correlation / stronger diversification. Never call it correlation collapse, market-structure breakdown, or Beta failure.',
              '- Sys Corr alone can never establish Beta failure. Only discuss Beta/factor failure when explicit beta or factor-model diagnostics support it.',
              '- If Alpha p-value is absent OR p >= 0.10, do not claim an Alpha edge, persistent Alpha, high-Alpha opportunity, or ability to extract Alpha. If an estimate is supplied, call it an unproven point estimate.',
              '- If factor-model R-squared >= 0.80, do not describe Beta/systematic factors as ineffective or failed.',
              '- Z-score language: abs(Z) < 1 = near normal; 1 <= abs(Z) < 2 = elevated; abs(Z) >= 2 = unusually high/extreme. A single Z-score never proves forced liquidation, deleveraging, or a carry unwind.',
              '- Forced liquidation / deleveraging / carry unwind requires at least TWO independent confirming stress signals. Otherwise say risk is elevated or consistent with stress, not that liquidation is occurring.',
              '- Relative momentum is relative performance, not an absolute crash. Do not use bloodbath/crash language unless an absolute drawdown metric confirms it.',
              '- Positive RSP/SPY means improving market breadth / equal-weight leadership. Do not automatically call it small-cap leadership.',
              '- Use measured language. Avoid 崩潰、失效、強行榨取、血洗、暴力殺盤 unless the supplied quantitative evidence explicitly meets the rules above.',
              '',
          ]
          guardrails = '\n            '.join(guardrail_lines)
          if '[EVIDENCE_GUARDRAILS]' not in main:
              if '[OUTPUT_SCHEMA]' not in main:
                  raise SystemExit('No OUTPUT_SCHEMA prompt anchors found')
              main = main.replace('[OUTPUT_SCHEMA]', guardrails + '[OUTPUT_SCHEMA]')

          compass = replace_required(compass, 'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-2.5-flash")', 'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-3.8-flash")', 'market compass default model')
          old_compass_call = '        from google import genai\n        client = genai.Client(api_key=GEMINI_API_KEY)\n        response = client.models.generate_content(model=GEMINI_MODEL, contents=prompt)'
          new_compass_call = '\n'.join([
              '        from google import genai',
              '        from google.genai import types',
              '        client = genai.Client(api_key=GEMINI_API_KEY)',
              '        if str(GEMINI_MODEL).startswith(("gemini-3", "gemini-4")):',
              '            gemini_config = types.GenerateContentConfig(',
              '                response_mime_type="application/json",',
              '                thinking_config=types.ThinkingConfig(thinking_level="high"),',
              '            )',
              '        else:',
              '            gemini_config = types.GenerateContentConfig(',
              '                response_mime_type="application/json",',
              '                thinking_config=types.ThinkingConfig(thinking_budget=-1),',
              '            )',
              '        response = client.models.generate_content(model=GEMINI_MODEL, contents=prompt, config=gemini_config)',
          ])
          compass = replace_required(compass, old_compass_call, new_compass_call, 'market compass Gemini call')

          main = '\n'.join(line.rstrip() for line in main.splitlines()) + '\n'
          compass = '\n'.join(line.rstrip() for line in compass.splitlines()) + '\n'
          main_path.write_text(main, encoding='utf-8')
          compass_path.write_text(compass, encoding='utf-8')
          PY

      - name: Validate Gemini upgrade
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py scripts/update_market_compass.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          main = Path('main.py').read_text(encoding='utf-8')
          compass = Path('scripts/update_market_compass.py').read_text(encoding='utf-8')
          assert '"gemini-3.8-flash", "gemini-3.6-flash", "gemini-2.5-flash"' in main
          assert 'gemini-3-flash-preview' not in main
          assert 'gemini-2.0-flash' not in main
          assert 'thinking_level="high"' in main
          assert 'thinking_budget=-1' in main
          assert 'response_mime_type="application/json"' in main
          assert '[EVIDENCE_GUARDRAILS]' in main
          assert 'Sys Corr < 0.30 means low cross-asset correlation' in main
          assert 'If Alpha p-value is absent OR p >= 0.10' in main
          assert 'If factor-model R-squared >= 0.80' in main
          assert 'requires at least TWO independent confirming stress signals' in main
          assert 'Positive RSP/SPY means improving market breadth' in main
          assert 'GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-3.8-flash")' in compass
          assert 'thinking_level="high"' in compass
          assert 'thinking_budget=-1' in compass
          assert 'response_mime_type="application/json"' in compass
          print('Gemini 3.8 model + evidence guardrail assertions passed')
          PY

      - name: Commit final change and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/gemini38-guardrails-once.yml
          git add main.py scripts/update_market_compass.py
          git diff --cached --check
          git commit -m 'Upgrade Gemini insight model and evidence guardrails'
          git push origin HEAD:main

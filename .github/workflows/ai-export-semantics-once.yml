name: One-time AI export semantics fix

on:
  push:
    paths:
      - '.github/workflows/ai-export-semantics-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AI export semantics patch
        run: python scripts/patch_ai_export_semantics_once.py

      - name: Rebuild and validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -F "function portfolioAiHasQuantSource(meta)" assets/js/src/app.bundle.source.js
          grep -F "function portfolioAiPivotZone(meta, side)" assets/js/src/app.bundle.source.js
          grep -F "monthly_support: portfolioAiPivotZone(meta, 'support')" assets/js/src/app.bundle.source.js
          grep -F "monthly_resistance: portfolioAiPivotZone(meta, 'resistance')" assets/js/src/app.bundle.source.js
          grep -F "trend_score: portfolioAiHasQuantSource(meta) ?" assets/js/src/app.bundle.source.js
          grep -F "risk_score: portfolioAiHasQuantSource(meta) ?" assets/js/src/app.bundle.source.js
          if grep -Fq "monthly_support: portfolioAiClean(meta.monthly_support ?? meta.pivot_support)" assets/js/src/app.bundle.source.js; then
            echo 'stale monthly support mapping remains' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          s = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          assert "if (value === null || value === undefined || value === '') return null;" in s
          assert "mid: portfolioAiFinite(meta?.[`pivot_${side}_zone_mid`])" in s
          assert "distance_pct: portfolioAiFinite(meta?.[`pivot_${side}_distance_pct`])" in s
          for key in ('trend_score', 'momentum_score', 'technical_score', 'valuation_score', 'valuation_pressure', 'health_score', 'risk_score', 'max_drawdown_1y', 'volatility_20d', 'annualized_volatility'):
              line = next((ln for ln in s.splitlines() if ln.strip().startswith(key + ':') and 'portfolioAiHasQuantSource(meta)' in ln), None)
              if line is None:
                  raise SystemExit(f'missing quant-source gate for {key}')
          print('AI export semantic assertions passed')
          PY
          git diff --check

      - name: Commit final fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          git rm -f scripts/patch_ai_export_semantics_once.py .github/workflows/ai-export-semantics-once.yml
          git add assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Fix AI export technical zones and null semantics'
          git push origin HEAD:main

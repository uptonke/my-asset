name: Probe SRVR fallback holdings

on:
  push:
    branches:
      - test/srvr-fallback-20260807
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install requests beautifulsoup4
      - name: Probe fallback source
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          url = "https://companiesmarketcap.com/pacer-benchmark-data-infrastructure-real-estate-sctr-etf/holdings/"
          headers = {"User-Agent": "Mozilla/5.0 my-asset-holdings/1.0"}
          r = requests.get(url, headers=headers, timeout=30)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, "html.parser")
          text = soup.get_text(" ", strip=True)
          date_m = re.search(r"Etf holdings as of ([A-Za-z]+ \d{1,2}, \d{4})", text, re.I)
          count_m = re.search(r"Number of holdings:\s*(\d+)", text, re.I)
          rows = []
          for tr in soup.find_all("tr"):
              cells = [c.get_text(" ", strip=True) for c in tr.find_all(["td", "th"])]
              if len(cells) >= 3 and any("%" in c for c in cells):
                  rows.append(cells)
          result = {
              "source": "companiesmarketcap SRVR holdings fallback",
              "http_status": r.status_code,
              "bytes": len(r.content),
              "as_of": date_m.group(1) if date_m else None,
              "reported_holdings": int(count_m.group(1)) if count_m else None,
              "parsed_rows": len(rows),
              "sample": rows[:5],
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          Path("srvr_fallback_probe.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: srvr-fallback-probe
          path: srvr_fallback_probe.json
          if-no-files-found: error

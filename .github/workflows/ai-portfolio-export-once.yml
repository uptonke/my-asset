name: One-time AI portfolio export implementation

on:
  push:
    paths:
      - '.github/workflows/ai-portfolio-export-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AI portfolio export patch
        run: python scripts/patch_ai_portfolio_export_once.py

      - name: Build and validate frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -q 'function exportAiPortfolioJson' assets/js/src/app.bundle.source.js
          grep -q "schema: 'portfolio_ai_export_v1'" assets/js/src/app.bundle.source.js
          grep -q 'risk_summary:' assets/js/src/app.bundle.source.js
          grep -q 'quant_factors:' assets/js/src/app.bundle.source.js
          grep -q 'AI 分析 JSON' index.html
          git diff --check

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/ai-portfolio-export-once.yml scripts/patch_ai_portfolio_export_once.py
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md || true
          git add index.html assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Add AI-ready portfolio JSON export'
          git push origin HEAD:main

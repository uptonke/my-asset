name: One-time AI signal audit polish

on:
  push:
    paths:
      - '.github/workflows/ai-signal-audit-polish-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  polish-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch compatibility wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = 'row["selection_reason"] = f"未選入：priority {row[\'priority\']:.2f} 低於本輪 Top 4 門檻 {cutoff:.2f}。"'
          new = 'row["selection_reason"] = f"未選入：priority {row[\'priority\']:.2f}；本輪 Top 4 門檻/排序基準 {cutoff:.2f}，未進入前四。"'
          if old not in s:
              raise SystemExit('selection reason anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '        <div v-else class="rounded-2xl border border-dashed border-white/10 bg-black/10 px-5 py-8 text-center">'
          new = '        <div v-if="(aiInsights?.details || []).length === 0" class="rounded-2xl border border-dashed border-white/10 bg-black/10 px-5 py-8 text-center">'
          if old not in s:
              raise SystemExit('AI empty-state anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py
          python scripts/build_frontend_bundle.py --check
          node --check assets/js/app.bundle.js
          git diff --check
          grep -Fq '本輪 Top 4 門檻/排序基準' main.py
          grep -Fq 'v-if="(aiInsights?.details || []).length === 0"' index.html
      - name: Commit and clean up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/ai-signal-audit-polish-once.yml
          git add main.py index.html
          git diff --cached --check
          git commit -m 'Polish AI signal audit compatibility'
          git push origin HEAD:main

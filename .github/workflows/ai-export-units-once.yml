name: One-time AI export unit hardening

on:
  push:
    paths:
      - '.github/workflows/ai-export-units-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AI export unit hardening patch
        run: python scripts/patch_ai_export_units_once.py

      - name: Rebuild and validate frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          grep -F "schema: 'portfolio_ai_export_v1.1'" assets/js/src/app.bundle.source.js
          grep -F "native_currency: nativeCurrency" assets/js/src/app.bundle.source.js
          grep -F "current_price_native: currentPriceNative" assets/js/src/app.bundle.source.js
          grep -F "price_basis: 'native_market_currency'" assets/js/src/app.bundle.source.js
          grep -F "monthly_support: portfolioAiPivotZone(meta, 'support', nativeCurrency)" assets/js/src/app.bundle.source.js
          grep -F "volatility_20d_annualized" assets/js/src/app.bundle.source.js
          grep -F "volatility_long_horizon_annualized" assets/js/src/app.bundle.source.js
          grep -F "function portfolioAiValidate(payload)" assets/js/src/app.bundle.source.js
          grep -F "AI Export validation failed" assets/js/src/app.bundle.source.js
          if grep -Fq "volatility_20d:" assets/js/src/app.bundle.source.js; then
            echo 'ambiguous volatility_20d field remains in AI export' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          s = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          required = [
              "native_price_suffix: '_native'",
              "portfolio_price_suffix: '_twd'",
              "currency: currency || null",
              "fx_to_twd: nativeCurrency === 'USD'",
              "USD native price × FX does not reconcile to TWD price",
              "technical zone currency must match technical_context.price_currency",
              "252d_annualized_or_60d_fallback",
          ]
          for needle in required:
              assert needle in s, needle
          # Basic reconciliation check using the uploaded QQQ example scale.
          native = 23912.9241 / 31.83
          twd = native * 31.83
          assert abs(twd - 23912.9241) / 23912.9241 < 1e-12
          print('AI export unit semantic assertions passed')
          PY
          git diff --check

      - name: Commit final fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          git rm -f scripts/patch_ai_export_units_once.py .github/workflows/ai-export-units-once.yml
          git add assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --cached --check
          git commit -m 'Harden AI export units and price validation'
          git push origin HEAD:main

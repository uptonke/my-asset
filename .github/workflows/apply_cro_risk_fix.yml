name: Apply CRO risk consistency fix

on:
  push:
    branches:
      - fix/cro-risk-consistency-20260806

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cro-risk-consistency-20260806
          fetch-depth: 0

      - name: Reconstruct patch script
        shell: bash
        run: |
          cat .github/cro-fix/patch.* > /tmp/patch.b64
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('/tmp/patch.b64').read_text().strip()
          Path('scripts/_apply_cro_risk_fix.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python -m py_compile scripts/_apply_cro_risk_fix.py

      - name: Apply comprehensive CRO fixes
        run: python scripts/_apply_cro_risk_fix.py

      - name: Validate Python and frontend bundle
        shell: bash
        run: |
          rm -f scripts/_apply_cro_risk_fix.py
          python -m py_compile main.py scripts/build_daily_quant_monte_carlo_reference.py
          python scripts/build_frontend_bundle.py
          python scripts/build_frontend_bundle.py --check
          node --check assets/js/app.bundle.js
          python scripts/validate_repo_integrity.py --no-node

      - name: Commit changes
        shell: bash
        run: |
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          rm -f scripts/_apply_cro_risk_fix.py
          rm -rf .github/cro-fix
          rm -f .github/workflows/apply_cro_risk_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: align CRO risk horizons and rebalance signals"
          git push origin HEAD:fix/cro-risk-consistency-20260806

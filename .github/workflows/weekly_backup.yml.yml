name: Off-site Data Backup
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: private-performance-attribution
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'supabase>=2.7,<3'
      - name: Create owner-authorized plaintext backup
        id: backup
        run: python backup.py
      - name: Commit only the selected public backup
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_PATH" =~ ^backups/portfolio_backup_[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$BACKUP_PATH" "$BACKUP_PATH.sha256"
          if ! git diff --cached --quiet; then
            git commit -m "Auto-backup: $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi

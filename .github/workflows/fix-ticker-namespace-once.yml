name: One-time ticker namespace repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ticker-namespace-once.yml'

permissions:
  contents: write

jobs:
  repair-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical ticker handling in main.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          old = '''def normalize_ticker_symbol(value):
              """Normalize user-maintained ticker strings from Google Sheet / ledger."""
              if value is None:
                  return ""
              t = str(value).strip().upper()
              if not t or t in {"NAN", "NONE", "NULL", "-"}:
                  return ""
              return t
          '''
          new = '''def normalize_ticker_symbol(value):
              """Return one canonical portfolio ticker across ledger, Sheet, and analytics."""
              if value is None:
                  return ""
              t = str(value).strip().upper()
              if not t or t in {"NAN", "NONE", "NULL", "-"}:
                  return ""

              # Google Finance-style Taiwan symbols are aliases, not distinct assets.
              # Keep the portfolio namespace aligned with ledger tickers such as 2317/2382.
              for prefix in ("TPE:", "TWSE:", "TPEX:"):
                  if t.startswith(prefix):
                      candidate = t.split(":", 1)[1].strip()
                      if re.fullmatch(r"\\d{4}[A-Z]?", candidate):
                          t = candidate
                      break

              match = re.fullmatch(r"(\\d{4}[A-Z]?)\\.(TW|TWO)", t)
              if match:
                  t = match.group(1)
              return t
          '''
          replace_once(old, new, 'normalize_ticker_symbol')

          old = '''def normalize_ticker(raw):
              return str(raw).strip().upper() if raw is not None else ""
          '''
          new = '''def normalize_ticker(raw):
              return normalize_ticker_symbol(raw)
          '''
          replace_once(old, new, 'normalize_ticker')

          old = '''        stock_meta, ledger_data = db_record.get("stock_meta", {}), db_record.get("ledger_data", [])
                  ledger_tickers = [str(tx["ticker"]).strip().upper() for tx in ledger_data if tx.get("ticker")]
                  all_tickers = list(set(list(stock_meta.keys()) + ledger_tickers))
                  for t in all_tickers:
                      if t not in stock_meta: stock_meta[t] = {}

                  print("📊 正在從 Google Sheet 抓取自訂報價...", flush=True)
          '''
          new = '''        raw_stock_meta = db_record.get("stock_meta", {}) or {}
                  ledger_data = db_record.get("ledger_data", []) or []

                  # Canonicalize legacy aliases (e.g. TPE:2317 / 2317.TW -> 2317).
                  # Alias metadata is merged first; an already-canonical key wins on conflicts.
                  stock_meta = {}
                  if isinstance(raw_stock_meta, dict):
                      for raw_ticker, raw_meta in raw_stock_meta.items():
                          canonical = normalize_ticker_symbol(raw_ticker)
                          if not canonical:
                              continue
                          dest = stock_meta.setdefault(canonical, {})
                          if isinstance(raw_meta, dict):
                              for key, value in raw_meta.items():
                                  dest.setdefault(key, value)
                      for raw_ticker, raw_meta in raw_stock_meta.items():
                          canonical = normalize_ticker_symbol(raw_ticker)
                          if canonical and str(raw_ticker).strip().upper() == canonical and isinstance(raw_meta, dict):
                              stock_meta.setdefault(canonical, {}).update(raw_meta)

                  ledger_tickers = [
                      normalize_ticker_symbol(tx.get("ticker"))
                      for tx in ledger_data
                      if normalize_ticker_symbol(tx.get("ticker"))
                  ]
                  sheet_tickers = load_google_sheet_ticker_whitelist()
                  all_tickers = sorted(set(stock_meta.keys()) | set(ledger_tickers) | set(sheet_tickers))
                  for t in all_tickers:
                      stock_meta.setdefault(t, {})

                  print("📊 正在從 Google Sheet 抓取自訂報價...", flush=True)
          '''
          replace_once(old, new, 'pipeline universe initialization')

          old = '''            sheet_tickers = load_google_sheet_ticker_whitelist()

                      # Ledger holdings are the source of truth for actionable portfolio exposure.
          '''
          new = '''            # sheet_tickers was loaded before the Yahoo download so research-only
                      # candidates receive a mapping and historical data too.

                      # Ledger holdings are the source of truth for actionable portfolio exposure.
          '''
          replace_once(old, new, 'late sheet_tickers load')

          old = 't = str(tx.get("ticker", "")).strip().upper()'
          count = text.count(old)
          if count < 2:
              raise SystemExit(f'ledger ticker canonicalization: expected at least 2 matches, found {count}')
          text = text.replace(old, 't = normalize_ticker_symbol(tx.get("ticker"))')

          old = 'ticker = str(row[0]).strip().upper()'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Google Sheet price ticker canonicalization: expected 1 match, found {count}')
          text = text.replace(old, 'ticker = normalize_ticker_symbol(row[0])', 1)

          old = '''            for original_ticker in pipeline_tickers:
                      yf_ticker = ticker_to_yf.get(original_ticker, "")
                      if original_ticker in sheet_prices: stock_meta[original_ticker]["last_price"] = sheet_prices[original_ticker]
          '''
          new = '''            for original_ticker in pipeline_tickers:
                      stock_meta.setdefault(original_ticker, {})
                      yf_ticker = ticker_to_yf.get(original_ticker, "")
                      if original_ticker in sheet_prices:
                          stock_meta[original_ticker]["last_price"] = sheet_prices[original_ticker]
          '''
          replace_once(old, new, 'pipeline stock_meta guard')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched source
        run: |
          python -m py_compile main.py
          python - <<'PY'
          from pathlib import Path
          text = Path('main.py').read_text(encoding='utf-8')
          required = [
              'for prefix in ("TPE:", "TWSE:", "TPEX:")',
              'sheet_tickers = load_google_sheet_ticker_whitelist()',
              'all_tickers = sorted(set(stock_meta.keys()) | set(ledger_tickers) | set(sheet_tickers))',
              'stock_meta.setdefault(original_ticker, {})',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing expected repairs: {missing}')
          print('ticker namespace source repair validated')
          PY

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-ticker-namespace-once.yml
          git add main.py
          git diff --cached --check
          git commit -m 'Fix canonical Taiwan ticker handling in daily quant pipeline'
          git push origin HEAD:main

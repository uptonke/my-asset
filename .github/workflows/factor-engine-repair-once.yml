name: One-time multifactor regression repair

on:
  push:
    paths:
      - '.github/workflows/factor-engine-repair-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply factor engine repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_factor_engine_once.py

      - name: Validate Python and frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py
          node --check assets/js/src/app.bundle.source.js
          python scripts/build_frontend_bundle.py
          node --check assets/js/app.bundle.js
          cmp assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git diff --check

          python - <<'PY'
          import ast
          import math
          import re
          from pathlib import Path
          import numpy as np
          import pandas as pd

          text = Path('main.py').read_text(encoding='utf-8')
          required = [
              'if t.startswith("__") and t.endswith("__")',
              r're.fullmatch(r"\\d{4,6}[A-Z]?", candidate)',
              '.dropna(axis=1, how="all")',
              'pct_change(fill_method=None)',
              'def build_factor_market_value_weights(',
              '"weighting_method": "current_market_value_twd"',
              '"fama_french_status"',
              '"insufficient_aligned_weekly_samples"',
              'optimizer_returns = returns[valid_investable].dropna(how="any")',
          ]
          for needle in required:
              assert needle in text, needle
          assert 'total_shares = sum([current_shares.get(t, 0) for t in active_tickers])' not in text

          tree = ast.parse(text)
          wanted = {'_is_missing', '_num', 'normalize_ticker_symbol', 'build_factor_market_value_weights'}
          funcs = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name in wanted]
          assert {f.name for f in funcs} == wanted
          module = ast.Module(body=funcs, type_ignores=[])
          ns = {'re': re, 'np': np, 'pd': pd, 'math': math}
          exec(compile(module, '<factor-helper-test>', 'exec'), ns)

          norm = ns['normalize_ticker_symbol']
          assert norm('TPE:00981A') == '00981A'
          assert norm('TWSE:00675L') == '00675L'
          assert norm('2317.TW') == '2317'
          assert norm('__PORTFOLIO_REBALANCE__') == ''

          prices = pd.DataFrame({
              'QQQ': [99.0, 100.0],
              '2317.TW': [199.0, 200.0],
          }, index=pd.to_datetime(['2026-01-01', '2026-01-02']))
          weights, diag = ns['build_factor_market_value_weights'](
              active_tickers=['QQQ', '2317'],
              valid_yf_tickers=['QQQ', '2317.TW'],
              ticker_to_yf={'QQQ': 'QQQ', '2317': '2317.TW'},
              current_shares={'QQQ': 10, '2317': 10},
              stock_meta={'QQQ': {}, '2317': {}},
              prices_df=prices,
              settings={'exchangeRate': 30},
          )
          # QQQ = 10*100*30 = 30,000 TWD; 2317 = 10*200 = 2,000 TWD.
          assert abs(weights['QQQ'] - 0.9375) < 1e-12, weights
          assert abs(weights['2317.TW'] - 0.0625) < 1e-12, weights
          assert abs(float(weights.sum()) - 1.0) < 1e-12
          assert diag['market_value_twd_sum'] == 32000.0
          print('Factor helper tests passed')
          PY

          python - <<'PY'
          from pathlib import Path
          src = Path('assets/js/src/app.bundle.source.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          for needle in [
              "ff_status: 'unavailable'",
              'macroData.fama_french_status',
              'ff_sample_count',
              'ff_weighting',
          ]:
              assert needle in src, needle
          for needle in [
              '多因子迴歸解構 (FF5 + Momentum + TW + Crypto)',
              "stats?.ff_status === 'available'",
              '模型暫不可用：',
              'TWD 市值加權重建報酬 proxy',
          ]:
              assert needle in html, needle
          assert "stats?.ff_crypto || '-'" not in html
          print('Frontend factor status assertions passed')
          PY

      - name: Commit final repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/repo_architecture/frontend_build_status_latest.json data/repo_architecture/frontend_build_status_summary.md 2>/dev/null || true
          git rm -f scripts/patch_factor_engine_once.py .github/workflows/factor-engine-repair-once.yml
          git add main.py assets/js/src/app.bundle.source.js assets/js/app.bundle.js index.html
          git diff --cached --check
          git commit -m 'Fix multifactor regression data and weighting'
          git push origin HEAD:main

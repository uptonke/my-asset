name: Internal Package EVT Robustness

on:
  push:
    branches:
      - work/evt-robustness-20260809

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        run: |
          tar --exclude='.git' --exclude='.github/workflows/internal_package_evt_robustness.yml' -czf /tmp/repo-snapshot.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot-evt-robustness
          path: /tmp/repo-snapshot.tar.gz
          retention-days: 1

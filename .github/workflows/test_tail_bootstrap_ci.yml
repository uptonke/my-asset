name: Test Tail Bootstrap CI

on:
  push:
    branches:
      - work/historical-13w-20260808

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2.2,<3'
      - name: Compile and test tail inference
        run: |
          python -m py_compile scripts/tail_inference.py main.py
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from scripts.tail_inference import compute_tail_bootstrap_ci

          rng = np.random.default_rng(123)
          n = 260
          bench = rng.normal(0.001, 0.028, n)
          noise = rng.normal(0.0, 0.016, n)
          port = np.where(bench < 0, 1.25 * bench + noise, 0.80 * bench + noise)

          result = compute_tail_bootstrap_ci(
              pd.Series(port), pd.Series(bench), n_boot=1000, block_weeks=4, seed=42
          )
          print(result)
          assert result['status'] == 'available'
          assert result['conditional_corr_valid_reps'] >= 900
          assert result['crisis_corr_valid_reps'] >= 900
          assert result['downside_beta_valid_reps'] >= 900
          assert result['crisis_corr_ci95_low'] is not None
          assert result['downside_beta_ci95_low'] is not None

          short = compute_tail_bootstrap_ci(
              pd.Series(port[:15]), pd.Series(bench[:15]), n_boot=1000, block_weeks=4, seed=42
          )
          assert short['status'] == 'insufficient_sample'
          PY

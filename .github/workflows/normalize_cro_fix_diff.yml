name: Normalize CRO fix diff

on:
  push:
    branches:
      - fix/cro-risk-consistency-20260806

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cro-risk-consistency-20260806
          fetch-depth: 0

      - name: Preserve original newline styles and remove generated noise
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          paths = [
              'main.py',
              'assets/js/src/00-bootstrap-and-cro.js',
              'assets/js/src/30-risk-xray-tail.js',
              'assets/js/src/app.bundle.source.js',
              'assets/js/app.bundle.js',
              'index.html',
              'scripts/build_daily_quant_monte_carlo_reference.py',
          ]
          for path in paths:
              p = Path(path)
              if not p.exists():
                  continue
              base = subprocess.check_output(['git', 'show', f'origin/main:{path}'])
              current = p.read_bytes()
              base_uses_crlf = b'\r\n' in base
              normalized = current.replace(b'\r\n', b'\n')
              desired = normalized.replace(b'\n', b'\r\n') if base_uses_crlf else normalized
              if desired != current:
                  p.write_bytes(desired)
                  print(f'normalized newline style: {path}')
          PY
          git checkout origin/main -- data/repo_architecture/validation_gate_latest.json data/repo_architecture/validation_gate_summary.md

      - name: Validate normalized files
        shell: bash
        run: |
          python -m py_compile main.py scripts/build_daily_quant_monte_carlo_reference.py
          python scripts/build_frontend_bundle.py --check
          node --check assets/js/app.bundle.js

      - name: Commit normalization
        shell: bash
        run: |
          rm -f .github/workflows/normalize_cro_fix_diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: preserve source line endings and remove validation noise"
          git push origin HEAD:fix/cro-risk-consistency-20260806

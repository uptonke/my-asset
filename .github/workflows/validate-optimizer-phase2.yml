name: Validate Optimizer Phase 2
on:
  push:
    paths:
      - 'scripts/run_constrained_optimizer.py'
      - 'scripts/run_skfolio_sandbox.py'
      - 'scripts/update_stock_meta.py'
      - 'tests/test_constrained_optimizer.py'
      - '.github/workflows/validate-optimizer-phase2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 pandas==2.3.2 scipy==1.13.1 requests yfinance==0.2.66 'supabase>=2.7,<3'
      - run: python -m py_compile scripts/run_constrained_optimizer.py scripts/run_skfolio_sandbox.py
      - run: python -m unittest discover -s tests -p test_constrained_optimizer.py

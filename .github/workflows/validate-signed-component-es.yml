name: Validate Signed Component ES
on:
  push:
    paths:
      - 'scripts/update_stock_meta.py'
      - 'update_stock_meta.py'
      - 'tests/test_signed_component_es.py'
      - '.github/workflows/validate-signed-component-es.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-component-es:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.2
      - run: python -m unittest discover -s tests -p test_signed_component_es.py

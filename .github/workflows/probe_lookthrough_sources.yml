name: Probe Lookthrough Sources

on:
  push:
    branches: [work/lookthrough-p2-20260809]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe deps
        run: pip install requests beautifulsoup4
      - name: Probe 00981A source
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 my-asset-holdings/1.0','Accept':'*/*'}
          url='https://www.etfinfo.tw/etf/00981A/holdings'
          r=requests.get(url,headers=H,timeout=30)
          print('ETFINFO',r.status_code,r.url,r.headers.get('content-type'),len(r.content))
          html=r.text
          print('ENC',r.encoding,r.apparent_encoding)
          for pat in ['2330','00981A','holdings','__NEXT_DATA__','51','2049','TX']:
              print('\nPATTERN',pat)
              for m in list(re.finditer(re.escape(pat),html,re.I))[:10]:
                  a=max(0,m.start()-180); b=min(len(html),m.end()+300)
                  print(re.sub(r'\s+',' ',html[a:b])[:600])
          soup=BeautifulSoup(html,'html.parser')
          print('\nSCRIPTS')
          for s in soup.find_all('script'):
              src=s.get('src','')
              txt=s.string or s.get_text('',strip=False) or ''
              if src: print('SRC',src)
              if txt and any(x in txt for x in ['2330','00981A','holdings']):
                  print('INLINE',txt[:2000])
          print('\nROWS')
          for i,tr in enumerate(soup.find_all('tr')[:120]):
              cells=[' '.join(c.stripped_strings) for c in tr.find_all(['th','td'])]
              if cells: print(i,cells[:10])
          PY

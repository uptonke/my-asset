name: Probe Lookthrough Sources

on:
  push:
    branches: [work/lookthrough-p2-20260809]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe deps
        run: pip install requests beautifulsoup4
      - name: Probe sources
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 my-asset-holdings/1.0','Accept':'*/*'}

          for fund in ['VOO','VEA']:
              for start in [1,501]:
                  url=f'https://investor.vanguard.com/investment-products/etfs/profile/api/{fund}/portfolio-holding/stock?start={start}&count=500'
                  r=requests.get(url,headers=H,timeout=30)
                  print('VANGUARD_PAGE',fund,start,r.status_code,len(r.content))
                  if r.ok:
                      j=r.json(); rows=((j.get('fund') or {}).get('entity') or [])
                      print('  size',j.get('size'),'asOf',j.get('asOfDate'),'rows',len(rows),'first',rows[0].get('ticker') if rows else None,'last',rows[-1].get('ticker') if rows else None,'next',j.get('next'))

          url='https://www.avantisinvestors.com/avantis-investments/avantis-us-small-cap-value-etf/'
          r=requests.get(url,headers=H,timeout=30)
          print('AVUV_PAGE',r.status_code,len(r.text))
          html=r.text
          patterns=['AVUV','025072877','total-holdings','fundId','fundID','productId','productID','portfolioHoldings','holdings','api/','/api/']
          for pat in patterns:
              print('\nPATTERN',pat)
              for m in list(re.finditer(re.escape(pat),html,re.I))[:12]:
                  a=max(0,m.start()-220); b=min(len(html),m.end()+350)
                  print(re.sub(r'\s+',' ',html[a:b])[:750])
          print('\nSCRIPT_SRCS')
          soup=BeautifulSoup(html,'html.parser')
          for s in soup.find_all('script',src=True):
              src=s.get('src','')
              if src: print(src)

          for candidate in range(1,1100):
              # Cheap HEAD-like GET only for a small candidate set inferred from source snippets is preferable;
              # this loop is intentionally not used to hammer the site.
              pass
          PY

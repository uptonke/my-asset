name: Internal Patch CRO Plain Language

on:
  push:
    branches:
      - work/cro-plain-language-20260810
    paths:
      - .github/workflows/internal_patch_cro_plain_language.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cro-plain-language-20260810
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch CRO prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('assets/js/src/00-bootstrap-and-cro.js'),
              Path('assets/js/src/app.bundle.source.js'),
          ]

          old_header = """Tone: Direct, analytical, and proportionate to the evidence. Avoid dramatic language, certainty inflation, and moral judgments about the investor.\nConstraint: Output strictly in Traditional Chinese. Maximum 8 bullets. No pleasantries."""
          new_header = """Tone: Direct, analytical, and proportionate to the evidence. Avoid dramatic language, certainty inflation, and moral judgments about the investor.\nAudience: Intelligent non-specialist. Write for a reader who understands investing but may not know statistics or quant jargon.\nPlain-language rule: Lead with the practical meaning first, then give the key numbers. Prefer everyday Traditional Chinese. If a technical term is necessary, explain it briefly on first use in parentheses. Avoid unexplained acronyms, dense model terminology, and unnecessary English. Prefer「95% 信賴區間」over「CI」and explain bootstrap as「重抽樣估計」when methodology matters.\nConstraint: Output strictly in Traditional Chinese. Maximum 8 bullets. No pleasantries."""

          rebalance_anchor = "- Rebalance alerts include current weight, target weight, signed drift, and candidate action. Never infer Trim from an underweight alert."
          rebalance_extra = """- Rebalance alerts include current weight, target weight, signed drift, and candidate action. Never infer Trim from an underweight alert.\n- Reconcile action counts before writing: the number of actionable TRIM / ADD / BLOCKED items stated in prose must equal the items actually listed. Keep concentration-only, general-drift, and informational alerts separate from actionable trade counts.\n- Keep ETF look-through percentages semantically distinct: supported ETF sleeve % = portfolio weight of ETFs the engine supports; mapped underlying % = portfolio weight successfully mapped to underlying equities; supported-sleeve equity coverage % = equity coverage within those supported ETFs. Never call all three simply「覆蓋率」."""

          old_final = "- CRO 最終指令：Choose one of Review / Hold / Conditional Trim / Trim / Raise Cash. Use Trim or Raise Cash only when an explicit target band, concentration cap, buffer constraint, or risk-budget breach is shown. Otherwise use Review or Conditional Trim and state the trigger."
          new_final = """- CRO 最終指令：Choose one of Review / Hold / Conditional Trim / Trim / Raise Cash. Use Raise Cash only for an explicit portfolio-level liquidity/buffer or risk-budget need. Use Trim only when the evidence calls for a net reduction in portfolio risk or an explicit portfolio-level concentration/target breach. If the rule engine shows a mix of asset-level TRIM and ADD signals that mainly reflects target-weight drift, describe the action as rebalancing; choose Review by default, or Conditional Trim only when material trims clearly dominate and are needed to return to target. Never choose Trim solely because several individual assets have TRIM flags."""

          old_output = "- **[維度名稱]**: [結論、證據限制、具體下一步]"
          new_output = """- **[維度名稱]**: 先用 1 句白話說「這代表什麼」，再補最多 2–3 個真正重要的數字，最後用 1 句說明限制或下一步。每點 2–4 句。\n- 不要像研究論文逐項堆術語。讀者應該不用懂統計，也能知道：現在好不好、風險在哪、證據有多可靠、需要做什麼。"""

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'Audience: Intelligent non-specialist.' in text:
                  raise SystemExit(f'{path}: patch already present')
              for old, new, label in [
                  (old_header, new_header, 'header'),
                  (rebalance_anchor, rebalance_extra, 'rebalance semantics'),
                  (old_final, new_final, 'final directive'),
                  (old_output, new_output, 'output format'),
              ]:
                  if old not in text:
                      raise SystemExit(f'{path}: missing anchor {label}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Validate
        run: |
          node --check assets/js/app.bundle.js
          git diff --check
          python scripts/validate_repo_integrity.py --no-node

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/src/00-bootstrap-and-cro.js assets/js/src/app.bundle.source.js assets/js/app.bundle.js
          git commit -m 'Make CRO report plainer and tighten rebalance verdicts'
          git push origin HEAD:work/cro-plain-language-20260810

name: Internal Package PSR MinTRL

on:
  push:
    branches:
      - work/psr-mintrl-20260808

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        run: |
          tar --exclude='.git' --exclude='.github/workflows/internal_package_psr_mintrl.yml' -czf /tmp/repo-snapshot.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot-psr-mintrl
          path: /tmp/repo-snapshot.tar.gz
          retention-days: 1
